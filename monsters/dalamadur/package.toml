# Dalamadur package: Dalamadur, Shah Dalamadur and their tail halves (allocations.toml entries dalamadur,
# shah_dalamadur, dalamadur_tail, shah_dalamadur_tail), what the installer shows and installs, and the version
# written into the entries' data files.
name = "dalamadur"
kind = "monster"
title = "Dalamadur"
subtitle = "Elder Dragon, with Shah Dalamadur"
version = "1.0.5"       # bump on every published change of this package's files (data, assets or code)
requires_core = "1.6.0"    # oldest core module (exefs) that runs this version: its quests' board icon (byte 200)
                           # is the core's own atlas
requires = ["speartip_crag"]  # packages it needs besides the core (maps/<name>; later shared utilities)

[classes]                  # C prefix of each entry's class (module/build.py): <code>_register_class(), g_<code>_dti
dalamadur = "em090"        # uEm090_00: the head half, both variants (4U uEm024 runs em024 and em110)
shah_dalamadur = "em090"
dalamadur_tail = "em091"   # uEm091_00: the tail half, both variants (4U uEm083 runs em083 and em111)
shah_dalamadur_tail = "em091"

[size]                     # quest-result size record (module/main.c size_data): 4U table 0xf32008 + 16 x em {f32 base
                           # cm, mini, silver, gold}; em024 / em110 = 4039.7 with crowns -1 (none) -> [base]
dalamadur = [4039.7]
shah_dalamadur = [4039.7]
