# Stygian Zinogre package: what the installer shows and installs, and the version written into its data file.
name = "stygian_zinogre"
kind = "monster"
title = "Stygian Zinogre"
subtitle = "Fanged Beast"
version = "1.0.4"       # bump on every published change of this monster's files (data, assets or code)
requires_core = "1.7.3"    # oldest core module (exefs) that runs this version: its sound-variable / aura hooks (issue #8)
requires = ["heavens_mount"]  # packages it needs besides the core (maps/<name>; later shared utilities)
code = "em057_01"          # C prefix of its module code (hooks gated on GU variant 1)
gu_class = "uEm057_00"     # GU's Zinogre class runs it as variant 1 (module/build.py: registry DTI = donor's)

[size]                     # quest-result size record (module/main.c size_data): 4U table 0xf32008 + 16 x em {f32 base
                           # cm, mini, silver, gold}; em049 (Zinogre em048: 1455.4, 0.9, 1.15, 1.23)
stygian_zinogre = [1455.4, 0.97, 1.17, 1.23]
