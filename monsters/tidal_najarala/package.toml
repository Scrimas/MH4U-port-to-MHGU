# Tidal Najarala package: what the installer shows and installs, and the version written into its data file.
name = "tidal_najarala"
title = "Tidal Najarala"
class = "Snake Wyvern"     # its class, GU's name (monsterName 253..267): the installer's subtitle in every language
version = "0.2.12"      # bump on every published change of this monster's files (data, assets or code); 0.2.12:
                        # its Chinese text (lang/zh_TW.toml, zh_CN.toml; core 2.1.0); 0.2.11: each
                        # water jet gets its own hit group, as 4U (one hit no longer let the next jets pass through
                        # the hunter, maintainer's test 2026-11-09); 0.2.10: her
                        # weapons' own 4U sharpness where the table had no row left (KIRX), the dead Arena quest
                        # test of em068_01_fx.c out; 0.2.9: no
                        # Arena quest (11497 = m11016 gone); 0.2.8: only
                        # 4U's quests: the hub ones, no village copies (1060 / 1061 gone); 0.2.7: 4U's
                        # common dust on her ground records plays GU's snow (it showed yellow-orange); 0.2.6: the cut slither
                        # blends 60 frames (was 30), her spit's 0x402 -> 0x403 blends 8 frames (both games cut there); 0.2.5: the long blend
                        # of a cut slither survives GU's pair switch; 0.2.4: one Map at the
                        # start of her village quests, as GU's; 0.2.3: GU's snow set of its
                        # common dust on her moves, a longer blend when her slither is cut short; 0.2.2: GU's finer tracks
                        # of the motions she shares with it, her snow on the ground (world posts on her ground, 4U's Intensity
                        # in the colours, ground sets, snow chunks back); 0.2.1: her appended scale
                        # kinds load (their files lay behind the def), scale material as GU's, her end effect, one hit at G rank,
                        # no frenzied look, jet bounces on the attack's hit, Shiny at a scale's end; 0.2.0: her water jet
                        # (7/48-51 62-65: GU dropped the shot and her aim at her scales), GU's common effects where her motions
                        # are GU's; 0.1.1: her routes on GU's stage, her way to her sleep area, her eating data on the Frozen
                        # Seaway; 0.1.0: the first build, which the core's data pool refused in game, so she ran as a plain
                        # Najarala (notes/plan.md)
requires_core = "2.0.0"    # oldest core module (exefs) that runs this version: the first with her hooks and the
                           # weapons' own sharpness (KIRX, module/gear.c)
code = "em068_01"          # C prefix of its module code (hooks gated on GU variant 1)
gu_class = "uEm068_00"     # GU's Najarala class runs it as variant 1 (module/build.py: registry DTI = donor's)

[size]                     # quest-result size record (module/main.c size_data): 4U table 0xf32008 + 16 x em {f32 base
                           # cm, mini, silver, gold}; em093 (Najarala em023: 4055.0, 0.9, 1.15, 1.23)
tidal_najarala = [4055.0, 0.97, 1.17, 1.23]
