# Shrouded Nerscylla package: what the installer shows and installs, and the version written into its data file.
name = "shrouded_nerscylla"
title = "Shrouded Nerscylla"
version = "0.1.15"      # bump on every published change of this monster's files (data, assets or code); 0.1.15: her
                        # chest and arm armor take the armor colour as in 4U (FTransparency on their tinted material,
                        # tools/armor4u2gu.py --opaque-tint; they stayed cream, tests 2026-11-09); 0.1.14: the
                        # grey rock chunks of her dig-in and burst hidden (GU drew them near white, maintainer's
                        # test 2026-11-09), her 4U fall dust at 1x; 0.1.13: her
                        # weapons' own 4U sharpness (KIRX, read by the core's gear_kire_slash), the dead branch for
                        # GU Diablos' records out of em070_01_fx.c; 0.1.12: only
                        # 4U's quests where 4U has them (1062 village, 11370 / 11371 hub; 1063 / 1064 / 11369 gone); 0.1.11: her 4U
                        # turn dust (em096_040) out, the glitter; 0.1.10: dig-in and
                        # burst dust at 1x (not yellow), GU's glitter out of both discovery motions; 0.1.9: nothing
                        # under the ground any more, as in 4U (Diablos' trail out); 0.1.8: 4U's
                        # effects again at her dig-in and burst, GU's glitter out of her discovery motion; 0.1.7: Diablos'
                        # files in his arc order (an effect before its textures drew nothing), one trail per unit; 0.1.6: only GU Diablos'
                        # ground effects at her dig-in and burst (eruption 1402 / 1403), the world trail keeps his end mode; 0.1.5: her
                        # own burrow trail, placed on the ground over her and moved every frame; 0.1.4: the
                        # burrow trail is posted again when GU drops it mid-travel; 0.1.3: GU Diablos' burrow sand at
                        # her dig-in instead of 4U's dust, a travel log line; 0.1.2: GU Nerscylla's forest
                        # debris (cm200_067) no longer on her moves, 4U's dust at her dig-in again; 0.1.1: GU's ground trail while she travels under the ground; 0.1.0: the first build
requires_core = "1.9.0"    # oldest core module (exefs) that runs this version: plus her hooks, the weapons' own
                           # sharpness (KIRX, module/gear.c) and armor past the 576 "listed" bits
code = "em070_01"          # C prefix of its module code (hooks gated on her ID)
gu_class = "uEm070_00"     # GU's Nerscylla class runs it as variant 1 (module/build.py: registry DTI = donor's)

[size]                     # quest-result size record (module/main.c size_data): 4U table 0xf32008 + 16 x em {f32 base
                           # cm, mini, silver, gold}; em096 (Nerscylla em027: 946.7, 0.9, 1.12, 1.18)
shrouded_nerscylla = [998.9, 0.9, 1.12, 1.18]
