# Desert Seltas package: Desert Seltas and Desert Seltas Queen (allocations.toml entries desert_seltas,
# desert_seltas_queen), what the installer shows and installs, and the version written into the entries' data files.
name = "desert_seltas"
kind = "monster"
title = "Desert Seltas"
class = "Neopteron"        # its class, GU's name (monsterName 253..267): the installer's subtitle in every language
version = "0.1.18"      # bump on every published change of this package's files (data, assets or code); 0.1.18:
                        # on main's core 3.0.0: their Chinese text (lang/zh_TW.toml, zh_CN.toml), the Queen's m10924
                        # on quest 11374 (Heaven's Mount's tours took 11372), the test logs left out; 0.1.17:
                        # her underside glow 'XfB__m03_add' on Capcom's constant template of the same 4U material
                        # (build_seltas_arc.py ADD_CONST, mrl_anim.CONSTANT_MAP: its 'Normal' / 'Angry_*' entries had
                        # lost their tracks and it stayed on, lit), a test log of her pin (16/x, 7/75: her target
                        # check, the hunter's hold and reactions; module seltas.c pin_watch); 0.1.16:
                        # her grey rock units of her own effect model hidden in her ground effects (as issue #6's
                        # rule; they were black), her new male keeps sSoundControl's announce mark while she fights
                        # (module seltas.c seltas_mark, hook 0x4E4B18) and a test log of the hunter's reactions
                        # then (hook 0x2F1C68); 0.1.15:
                        # no discovery sting when she digs a new male up (module seltas.c seltas_sting, hook
                        # 0x4E5240: sSoundControl announced every restored male again); 0.1.14:
                        # the buried new male also takes GU's restore-entry mark rec+0x5c8c (the discovery sound
                        # stayed in 0.1.13), a test log of their alert changes and of sSoundControl's stream
                        # requests (module seltas.c, hooks 0xBCB9C / 0x4E34AC); 0.1.13:
                        # her three big shots at 1x brightness (build_seltas_arc.py SHOT_1X: 4U's x2 drew them nearly
                        # white), the new male joins her fight without the discovery sound (module seltas.c
                        # buried_entry: GU's alert setter 0xbcb9c with state 1); 0.1.12:
                        # every ground splash 0x13a of his takes his own 4U effect, whoever posts it (module
                        # seltas_shots.c hook 0x48C4F8; two were still GU's green), the new male waits buried for
                        # her pull (the dig-in's 3600-frame timer; he came out by himself at once); 0.1.11:
                        # his launch death is 4U's death by impact (11/8: its own script and motion 0x350 with the
                        # burst em094_204; module seltas.c launch_end through GU's 0x9c2b4), he no longer dies a
                        # plain death in the air; 0.1.10:
                        # the last two green ground posts in their own 4U effects (his shots' second splash from GU's
                        # shell callback, her shots' ground splash: family 0x128; tools/shots_seltas.py, module
                        # seltas_shots.c), a new Desert Seltas enters buried for his Queen's pull as in 4U (module
                        # seltas.c buried_entry; he flew in before); 0.1.9: on
                        # MHGU Definitive Edition 2.0.0 (its package keys, the core's mhgu_de data folder), a test
                        # log of where each of their shells takes its effects from (module seltas_shots.c, the user
                        # on 0.1.8: his shots on her back still green); 0.1.8:
                        # his volley's ground splash in his own 4U colours (tools/shots_seltas.py family 0x13a, module
                        # seltas_shots.c hook 0xFDCBE4; it was GU's green splash), all their soil-coloured dust at
                        # 1x (build_seltas_arc.py own_sand: her pull of him out of the sand was bright yellow); 0.1.7:
                        # he dies when her launch ends his flight, with no corpse (module seltas.c launch_end, the
                        # 4U wiki's "shatters"; he hung in the flight before); 0.1.6:
                        # their shots in their own 4U colours (tools/shots_seltas.py: GU's sand / green tint of
                        # the species off their records; his spit on her back was green); 0.1.5: a
                        # test log of his rides and launched flights, a normal Seltas' too (module seltas.c
                        # flight_log; his 7/67 after her launch never ended in the 0.1.4 test); 0.1.4: he
                        # stays with his Queen and comes when she calls (module seltas_pair.c; GU names both by
                        # the normal Seltas' IDs), GU's dust instead of their 4U sand where GU's motion has it,
                        # their 4U sand at 1x elsewhere (not bright yellow-white); 0.1.3: their
                        # own 4U shots (tools/shots_seltas.py families, module seltas_shots.c); 0.1.2: the
                        # Queen's 4U reactions (module seltas_react.c; GU ends them at once for a variant), HP log;
                        # 0.1.1: the Queen's 4U AI script g14 s0 in her table, her attackdata = GU's (notes/plan.md
                        # History); 0.1.0: the first build
requires_core = "3.0.0"    # oldest core module (exefs) that runs this version: 3.0.0 plus their hooks, the guests of
                           # a quest (allocations.toml guest_in) and per-entry GU classes (package.toml gu_classes):
                           # the next core release (the maintainer sets its number, as for PR #23)
requires = []              # packages it needs besides the core (maps/<name>): the Dunes and the Ancestral Steppe are
                           # GU's own stages

[classes]                  # C prefix of each entry's module code (hooks gated on its ID)
desert_seltas = "em076_01"
desert_seltas_queen = "em069_01"

[gu_classes]               # the GU class that runs each entry as variant 1 (module/build.py: registry DTI = donor's)
desert_seltas = "uEm076_00"
desert_seltas_queen = "uEm069_00"

[size]                     # quest-result size record (module/main.c size_data): 4U table 0xf32008 + 16 x em {f32 base
                           # cm, mini, silver, gold}; em094 (Seltas em025: 615.9, 0.9, 1.15, 1.23), em095 (Seltas
                           # Queen em026: 1444.8, 0.9, 1.15, 1.23)
desert_seltas = [613.3, 0.97, 1.17, 1.23]
desert_seltas_queen = [1833.5, 0.97, 1.17, 1.23]
