# Gogmazios package: what the installer shows and installs (goal 3), and the version written into its data file.
name = "gogmazios"
kind = "monster"
title = "Gogmazios"
class = "Elder Dragon"     # its class, GU's name (monsterName 253..267): the installer's subtitle in every language
version = "1.1.8"       # bump on every published change of this monster's files (data, assets or code); 1.1.8:
                        # its Chinese text (lang/zh_TW.toml, zh_CN.toml; core 2.1.0)
requires_core = "1.7.3"    # oldest core module (exefs) that runs this version: the eyelid states (field-3 XFS
                           # states 1 / 6) need the module that opens the eyes at spawn (issue #11)
requires = ["battlequarters"]  # packages it needs besides the core (maps/<name>; later shared utilities)
code = "em089"             # C prefix of its module code: em089_register_class(), g_em089_dti (module/build.py)

[size]                     # quest-result size record (module/main.c size_data): 4U table 0xf32008 + 16 x em {f32 base
                           # cm, mini, silver, gold}; em089 = 4920.5 with crowns -1 (none) -> [base]
gogmazios = [4920.5]
