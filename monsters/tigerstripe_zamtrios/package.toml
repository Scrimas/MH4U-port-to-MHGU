# Tigerstripe Zamtrios package: what the installer shows and installs (goal 3), and the version written into its data file.
name = "tigerstripe_zamtrios"
kind = "monster"
title = "Tigerstripe Zamtrios"
class = "Amphibian"        # its class, GU's name (monsterName 253..267): the installer's subtitle in every language
version = "1.1.5"       # bump on every published change of this monster's files (data, assets or code); 1.1.5:
                        # its Chinese text (lang/zh_TW.toml, zh_CN.toml; core 2.1.0)
requires_core = "1.6.0"    # oldest core module (exefs) that runs this version: its quest's board icon (byte 202)
                           # is the core's own atlas
requires = []              # packages it needs besides the core (maps/<name>; later shared utilities)
code = "em067_01"          # C prefix of its module code (hooks gated on GU variant 1)
gu_class = "uEm067_00"     # GU's Zamtrios class runs it as variant 1 (module/build.py: registry DTI = donor's)

[size]                     # quest-result size record (module/main.c size_data): 4U table 0xf32008 + 16 x em {f32 base
                           # cm, mini, silver, gold}; em092 (Kiranico: mini < 1474.0, large > 1777.9, king > 1869.1)
tigerstripe_zamtrios = [1519.6, 0.97, 1.17, 1.23]
