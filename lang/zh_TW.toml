"armorSeriesData.13066" = { text = "以黑鎧龍素材製成的\r\n身體裝備。\r\n重視屬性防禦。", en = "cf81fca3" }
"armorSeriesData.13067" = { text = "以黑鎧龍素材製成的\r\n腕部裝備。體積龐大，\r\n卻意外地好活動。", en = "5a4c6f7f" }
