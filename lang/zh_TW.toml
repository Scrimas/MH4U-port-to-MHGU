"armorSeriesData.13070" = { text = "一角龍S頭盔", en = "4f868971" }
"armorSeriesData.13071" = { text = "一角龍S鎧甲", en = "334a1bc4" }
"armorSeriesData.13072" = { text = "一角龍S腕甲", en = "4eda0027" }
"armorSeriesData.13073" = { text = "一角龍S腰甲", en = "592c5b39" }
"armorSeriesData.13074" = { text = "一角龍S護腿", en = "2a300344" }
"armorSeriesData.13075" = { text = "以被沙磨亮的一角龍素材\r\n製成的頭部裝備。\r\n緋紅之角閃耀著孤高獵人的驕傲。", en = "3406ed78" }
"armorSeriesData.13076" = { text = "以被沙磨亮的一角龍素材\r\n製成的身體裝備。\r\n如火的緋角是獵人的驕傲。", en = "75081934" }
"armorSeriesData.13077" = { text = "以被沙磨亮的一角龍素材\r\n製成的腕部裝備。\r\n能使出銳利猛烈的突刺。", en = "85240bfb" }
"armorSeriesData.13078" = { text = "以被沙磨亮的一角龍素材\r\n製成的腰部裝備。\r\n堅實的角守護獵人之魂。", en = "f61a298f" }
"armorSeriesData.13079" = { text = "以被沙磨亮的一角龍素材\r\n製成的腳部裝備。\r\n獵人活過並成為傳說的證明。", en = "f637931b" }
"armorSeriesData.13080" = { text = "一角龍S帽", en = "bc005ad3" }
"armorSeriesData.13081" = { text = "一角龍S輕甲", en = "cf5de653" }
"armorSeriesData.13082" = { text = "一角龍S手甲", en = "75a8638b" }
"armorSeriesData.13083" = { text = "一角龍S護腰", en = "e88330be" }
"armorSeriesData.13084" = { text = "一角龍S脛甲", en = "9dea6f74" }
"armorSeriesData.13085" = { text = "以被沙磨亮的一角龍素材\r\n製成的頭部裝備。\r\n獨角象徵著無與倫比的獵人。", en = "554bb44a" }
"armorSeriesData.13086" = { text = "以被沙磨亮的一角龍素材\r\n製成的身體裝備。\r\n其中寄宿著獵人不屈的決心。", en = "08c19b88" }
"armorSeriesData.13087" = { text = "以被沙磨亮的一角龍素材\r\n製成的腕部裝備。\r\n能在堅固防禦後發出貫穿一擊。", en = "b41a9bed" }
"armorSeriesData.13088" = { text = "以被沙磨亮的一角龍素材\r\n製成的腰部裝備。\r\n其角如哨兵般守護獵人。", en = "99520a55" }
"armorSeriesData.13089" = { text = "以被沙磨亮的一角龍素材\r\n製成的腳部裝備。\r\n緋紅之魂將足跡烙入歷史。", en = "e5da70de" }
"armorSeriesData.13090" = { text = "一角龍X頭盔", en = "396b8958" }
"armorSeriesData.13091" = { text = "一角龍X鎧甲", en = "2f31c479" }
"armorSeriesData.13092" = { text = "一角龍X腕甲", en = "a519fe75" }
"armorSeriesData.13093" = { text = "一角龍X腰甲", en = "73e12c0d" }
"armorSeriesData.13094" = { text = "一角龍X護腿", en = "93c04d43" }
"armorSeriesData.13095" = { text = "一角龍的頭部裝備，\r\n英雄的象徵。緋紅之角直指天際，\r\n喚起史詩般的意志。", en = "828ada35" }
"armorSeriesData.13096" = { text = "一角龍的身體裝備，\r\n英雄的象徵。強大的脈動\r\n將兇猛注入獵人體內。", en = "6b0516b3" }
"armorSeriesData.13097" = { text = "一角龍的腕部裝備，\r\n英雄的象徵。與生俱來的驕傲\r\n讓獵人成為活傳奇。", en = "fbfaedfa" }
"armorSeriesData.13098" = { text = "一角龍的腰部裝備，\r\n英雄的象徵。在嚴酷環境中\r\n淬鍊的甲片守護著獵人。", en = "f94fde6b" }
"armorSeriesData.13099" = { text = "一角龍的腳部裝備，\r\n英雄的象徵。穿戴者不屈的身姿\r\n將被世代傳頌。", en = "7136524f" }
"armorSeriesData.13100" = { text = "一角龍X帽", en = "3218e5a7" }
"armorSeriesData.13101" = { text = "一角龍X輕甲", en = "f7db8a65" }
"armorSeriesData.13102" = { text = "一角龍X手甲", en = "e7f0007f" }
"armorSeriesData.13103" = { text = "一角龍X護腰", en = "77703fb0" }
"armorSeriesData.13104" = { text = "一角龍X脛甲", en = "0d2b9470" }
"armorSeriesData.13105" = { text = "一角龍的頭部裝備，\r\n英雄的象徵。閃耀的緋紅之角\r\n宣告傳說的到來。", en = "83872cb1" }
"armorSeriesData.13106" = { text = "一角龍的身體裝備。\r\n會隨著穿戴者靈魂的堅毅\r\n而變得更加堅硬。", en = "cc4952dd" }
"armorSeriesData.13107" = { text = "一角龍的腕部裝備，\r\n英雄的象徵。久經考驗的強度\r\n為攻擊注入力量。", en = "3361d632" }
"armorSeriesData.13108" = { text = "一角龍的腰部裝備，\r\n英雄的象徵。排列的硬甲\r\n能彈開各種攻擊。", en = "663a0fd8" }
"armorSeriesData.13109" = { text = "一角龍的腳部裝備，\r\n英雄的象徵。每一步都是\r\n孤高獵人驕傲歷史的一頁。", en = "f44f12aa" }
"armorSeriesData.13110" = { text = "絞蛇龍Z頭盔", en = "f32bb007" }
"armorSeriesData.13111" = { text = "絞蛇龍Z鎧甲", en = "44d18c0d" }
"armorSeriesData.13112" = { text = "絞蛇龍Z腕甲", en = "9ccc1745" }
"armorSeriesData.13113" = { text = "絞蛇龍Z護裙", en = "f48bc89e" }
"armorSeriesData.13114" = { text = "絞蛇龍Z護腿", en = "c7b86e93" }
"armorSeriesData.13115" = { text = "自古以來被視為聖遺物的\r\n頭部裝備。水蛇龍的純淨\r\n能驅散邪惡。", en = "8764b6f6" }
"armorSeriesData.13116" = { text = "散發凌厲氣息的精湛\r\n身體裝備。流露出\r\n足以匹配戰士族長的威嚴。", en = "445ead4e" }
"armorSeriesData.13117" = { text = "以美麗的水蛇龍素材\r\n製成的腕部裝備。\r\n展現時光的潮起潮落。", en = "b8172c6d" }
"armorSeriesData.13118" = { text = "排列著耀眼漸層色彩的\r\n腰部裝備。如幸運之星般\r\n引領獵人走向榮耀。", en = "05509f65" }
"armorSeriesData.13119" = { text = "由擅長在嚴酷氣候中\r\n生存的部族設計的腳部裝備。\r\n適合英勇的英雄。", en = "5571be9c" }
"armorSeriesData.13120" = { text = "絞蛇龍Z帽", en = "72443a7a" }
"armorSeriesData.13121" = { text = "絞蛇龍Z輕甲", en = "38986b77" }
"armorSeriesData.13122" = { text = "絞蛇龍Z手甲", en = "8e775911" }
"armorSeriesData.13123" = { text = "絞蛇龍Z護腰", en = "2837d1fa" }
"armorSeriesData.13124" = { text = "絞蛇龍Z脛甲", en = "8580a3a6" }
"armorSeriesData.13125" = { text = "族長的頭部裝備。\r\n莊嚴的裝飾\r\n散發著神聖的光輝。", en = "80a6400d" }
"armorSeriesData.13126" = { text = "開創了新傳統的身體裝備。\r\n「納加的金眼」\r\n正適合英雄佩戴。", en = "9bf97809" }
"armorSeriesData.13127" = { text = "部族傳統的堅固腕部裝備。\r\n曾經拯救過\r\n無與倫比的傳說英雄。", en = "3eb98a16" }
"armorSeriesData.13128" = { text = "將獨特素材發揮到極致的\r\n美麗腰部裝備。如此燦爛的裝飾\r\n正屬於族長。", en = "43dca818" }
"armorSeriesData.13129" = { text = "獻給驕傲英雄的腳部裝備。\r\n受祝福的設計\r\n確保穿戴者戰無不勝。", en = "12783c81" }
"armorSeriesData.13130" = { text = "影蜘蛛Z頭盔", en = "49beb553" }
"armorSeriesData.13131" = { text = "影蜘蛛Z鎧甲", en = "0f198af7" }
"armorSeriesData.13132" = { text = "影蜘蛛Z腕甲", en = "7dd8970b" }
"armorSeriesData.13133" = { text = "影蜘蛛Z護裙", en = "e272b9d9" }
"armorSeriesData.13134" = { text = "影蜘蛛Z護腿", en = "f0593fc0" }
"armorSeriesData.13135" = { text = "以骸蜘蛛素材製成的\r\n威嚴頭部裝備。戴在驕傲的\r\n騎士頭上，便是希望的燈塔。", en = "0f31af4a" }
"armorSeriesData.13136" = { text = "以骸蜘蛛素材製成的\r\n威嚴身體裝備。\r\n詭異的甲片能迷惑獵物。", en = "24432786" }
"armorSeriesData.13137" = { text = "以骸蜘蛛素材製成的\r\n威嚴腕部裝備。精巧的鍛造\r\n使攻擊更加優雅。", en = "0a6a030d" }
"armorSeriesData.13138" = { text = "以骸蜘蛛素材製成的\r\n腰部裝備。甲片經過打磨，\r\n輕如羽毛。", en = "5b8144c0" }
"armorSeriesData.13139" = { text = "以骸蜘蛛素材製成的\r\n腳部裝備。\r\n關節機構是最尖端的設計。", en = "afdc4ebf" }
"armorSeriesData.13140" = { text = "影蜘蛛Z帽", en = "0a15b9a6" }
"armorSeriesData.13141" = { text = "影蜘蛛Z輕甲", en = "1b6e5651" }
"armorSeriesData.13142" = { text = "影蜘蛛Z手甲", en = "d979eab0" }
"armorSeriesData.13143" = { text = "影蜘蛛Z護腰", en = "f02961f6" }
"armorSeriesData.13144" = { text = "影蜘蛛Z脛甲", en = "0fe3a5ee" }
"armorSeriesData.13145" = { text = "以骸蜘蛛素材製成的\r\n威嚴頭部裝備。\r\n對稱的造型象徵至高的騎士道。", en = "be87d0b2" }
"armorSeriesData.13146" = { text = "以骸蜘蛛素材製成的\r\n威嚴身體裝備。\r\n毫無破綻，令敵人膽寒。", en = "ec2b26bd" }
"armorSeriesData.13147" = { text = "以骸蜘蛛素材製成的\r\n腕部裝備。\r\n消除了一切妨礙行動的因素。", en = "88e28fbb" }
"armorSeriesData.13148" = { text = "以骸蜘蛛素材製成的\r\n腰部裝備。旗幟般的珍珠光澤\r\n令人肅然起敬。", en = "0eeb6757" }
"armorSeriesData.13149" = { text = "以骸蜘蛛素材製成的\r\n腳部裝備。逐片強化，\r\n將機動性發揮到極致。", en = "7632539f" }
"itemData.5982" = { text = "蛇王龍的鋼鱗", en = "5ff0984f" }
"itemData.5983" = { text = "鱗中之王，\r\n連最鋒利的刀刃也能擋下。\r\n能製作出驚人的裝備。", en = "d58eec3b" }
"itemData.5984" = { text = "蛇王龍的尾鱗", en = "358dba42" }
"itemData.5985" = { text = "堅硬卻柔韌的鱗片。\r\n可用來製作保護關節要害\r\n的柔軟防具。", en = "2fcf6aa5" }
"itemData.5986" = { text = "蛇王龍的魔眼", en = "1eac23b4" }
"itemData.5987" = { text = "看透一切的眼睛。\r\n心志不堅的工匠\r\n將被它摧毀心神。", en = "e82ac5ef" }
"itemData.5988" = { text = "蛇王龍的胸殼", en = "d2f78c1f" }
"itemData.5989" = { text = "本就堅如金剛的身體中\r\n最堅硬的部位。\r\n堅不可摧。", en = "7972e789" }
"itemData.5990" = { text = "蛇王龍的刃鱗", en = "1d776ef7" }
"itemData.5991" = { text = "獨特的鱗片，使其主人\r\n全身化為無數\r\n劈山裂石的利劍。", en = "871858f6" }
"itemData.5992" = { text = "蛇王龍的大剛爪", en = "fcb8d83d" }
"itemData.5993" = { text = "可怕的大爪。\r\n狠狠刨入大地，\r\n所過之處寸草不留。", en = "41ca8d8c" }
"itemData.5994" = { text = "蛇王龍的尾殼", en = "a8729408" }
"itemData.5995" = { text = "如鞭般的尾巴的甲殼。\r\n其揮動能撼動\r\n天界與人間。", en = "c0d28f69" }
"itemData.5996" = { text = "蛇王龍的扇刃", en = "b6320a5b" }
"itemData.5997" = { text = "蛇王龍背上\r\n最發達的刃鱗。\r\n能讓大地為之哀號。", en = "b928192c" }
"itemData.5998" = { text = "螺旋骨", en = "db014017" }
"itemData.5999" = { text = "蛇王龍扭曲的螺旋狀骨頭。\r\n經過鍛鍊，\r\n強度難以估量。", en = "bbf1f554" }
"itemData.6000" = { text = "天刃玉", en = "dfcef62f" }
"itemData.6001" = { text = "末日之際，以巨蛇的生命力\r\n孕育出新星\r\n的寶玉。", en = "3d1be1e6" }
"itemData.6002" = { text = "碎裂的凶星", en = "58699407" }
"itemData.6003" = { text = "應蛇王龍之召而墜落的\r\n星星碎片。\r\n極難加工。", en = "88f9edcc" }
"itemData.6004" = { text = "蛇王龍票券", en = "38b0e9af" }
"itemData.6005" = { text = "印有蛇王龍的票券。\r\n可在加工店兌換，\r\n製作珍奇的裝備。", en = "348f2e21" }
"itemData.6006" = { text = "蛇王龍的餘料", en = "81d102a0" }
"itemData.6007" = { text = "小且殘缺的素材。\r\n形狀不規則，如果收集起來的話，\r\n能夠製作隨從的武具。", en = "6898ea5e" }
"itemData.6008" = { text = "蛇王龍的上鋼鱗", en = "426f462b" }
"itemData.6009" = { text = "厚實而具王者風範的鱗片。\r\n強韌柔軟，\r\n能輕易解決獵物。", en = "4b5a60e8" }
"itemData.6010" = { text = "蛇王龍的上刃鱗", en = "158e2454" }
"itemData.6011" = { text = "無數帶鉤鱗片之一。\r\n蛇王龍爬行而過時\r\n能將山脈撕裂。", en = "686dd637" }
"itemData.6012" = { text = "蛇王龍的重胸殼", en = "84f470dd" }
"itemData.6013" = { text = "發出不祥轟鳴的鱗甲。\r\n隨時準備將觸及範圍內的\r\n一切撕碎。", en = "28016c36" }
"itemData.6014" = { text = "蛇王龍的剛鉤爪", en = "57d64d66" }
"itemData.6015" = { text = "掌握生死的鉤爪。\r\n或許該說是\r\n「先生，後死」。", en = "27620cf0" }
"itemData.6016" = { text = "蛇王龍的上扇刃", en = "8e728239" }
"itemData.6017" = { text = "特別巨大的一對扇刃。\r\n曾經斬斷\r\n大地的龍脈。", en = "4cd18010" }
"itemData.6018" = { text = "蛇王龍的上尾鱗", en = "8ba2f831" }
"itemData.6019" = { text = "緊密堆疊的厚鱗，\r\n能將空氣撕裂。\r\n可大幅強化裝備。", en = "640db672" }
"itemData.6020" = { text = "蛇王龍的重尾殼", en = "7bd287b8" }
"itemData.6021" = { text = "形似巨大剪刀的甲殼。\r\n在獵物面前舉起時\r\n宛如死神的鐮刀。", en = "61b35b02" }
"itemData.6022" = { text = "天刃的龍神玉", en = "26809181" }
"itemData.6023" = { text = "重塑世界的寶玉。\r\n血化為海，肉化為地，\r\n骨化為林。", en = "7f04e11d" }
"itemData.6024" = { text = "蛇帝龍的上鋼鱗", en = "8b30b98b" }
"itemData.6025" = { text = "蛇帝龍的外皮。\r\n堅硬柔韌的層層鱗片\r\n構成無懈可擊的防禦。", en = "b0cf9958" }
"itemData.6026" = { text = "蛇帝龍的上刃鱗", en = "c23adcc9" }
"itemData.6027" = { text = "預示毀滅的緋紅鱗片。\r\n能將偉大的命運\r\n無情斬斷。", en = "512068ab" }
"itemData.6028" = { text = "蛇帝龍的魔眼", en = "db7862d8" }
"itemData.6029" = { text = "目光冰冷銳利的眼睛。\r\n大多數人連看一眼\r\n都承受不住。", en = "f1f5564b" }
"itemData.6030" = { text = "蛇帝龍的重胸殼", en = "78fb5117" }
"itemData.6031" = { text = "包覆心臟的厚甲。\r\n凡人打造的刀刃\r\n傷不了它分毫。", en = "a4babc2b" }
"itemData.6032" = { text = "蛇帝龍的剛鉤爪", en = "1263b642" }
"itemData.6033" = { text = "巨大的鉤爪。\r\n能將天地\r\n撕得粉碎。", en = "0e4d6747" }
"itemData.6034" = { text = "蛇帝龍的上扇刃", en = "53f1b391" }
"itemData.6035" = { text = "特別巨大的一對扇刃。\r\n據說能劃破天空，\r\n引來流星。", en = "f2d906d1" }
"itemData.6036" = { text = "蛇帝龍的上尾鱗", en = "fbf7d116" }
"itemData.6037" = { text = "緋紅扭曲的鱗片。\r\n緊密排列在\r\n勢不可擋的尾巴上。", en = "8458b2c2" }
"itemData.6038" = { text = "蛇帝龍的重尾殼", en = "1ac6224c" }
"itemData.6039" = { text = "堅硬的甲殼。\r\n既是防禦的鎧甲，\r\n也是毀滅的武器。", en = "29163b7e" }
"itemData.6040" = { text = "蛇王龍的上級餘料", en = "1fd348b7" }
"itemData.6041" = { text = "殘缺的優質素材。\r\n形狀不規則，如果收集起來的話，\r\n能夠製作隨從的武具。", en = "81c36afe" }
"itemData.6042" = { text = "獄狼龍的堅殼", en = "0c8c4006" }
"itemData.6043" = { text = "獄狼龍的黑色甲殼。\r\n帶著它就像\r\n背負著一片地獄。", en = "83e052ba" }
"itemData.6044" = { text = "獄狼龍的尖角", en = "200ced19" }
"itemData.6045" = { text = "令人恐懼的角。\r\n如今成了向所有龍\r\n宣戰的象徵。", en = "852346d5" }
"itemData.6046" = { text = "獄狼龍的尖爪", en = "b5901a54" }
"itemData.6047" = { text = "具毀滅性的爪。\r\n足以憑它開闢出\r\n絕對霸主的地位。", en = "d0313f4f" }
"itemData.6048" = { text = "獄狼龍的尾巴", en = "80cd5e53" }
"itemData.6049" = { text = "獄狼龍肌肉發達的尾巴。\r\n能輕易\r\n撕裂鋼鐵。", en = "beb1c22f" }
"itemData.6050" = { text = "獄狼龍的龍光殼", en = "d5652527" }
"itemData.6051" = { text = "蘊含強大龍屬性能量的\r\n獄狼龍甲殼。\r\n應該非常適合加工。", en = "7043f8de" }
"itemData.6052" = { text = "蝕龍蟲", en = "4c8c68ca" }
"itemData.6053" = { text = "喜愛屠龍果實、\r\n會積蓄龍屬性能量的蟲。\r\n是獄狼龍的力量來源。", en = "73916926" }
"itemData.6054" = { text = "獄狼龍的龍毛", en = "5f938558" }
"itemData.6055" = { text = "獄狼龍粗硬的龍毛。\r\n其中蘊含的滅龍之力\r\n令龍族畏懼。", en = "ecb2b25e" }
"itemData.6056" = { text = "獄狼龍的怨念石", en = "43aa7d4c" }
"itemData.6057" = { text = "偶爾才會在腹中\r\n形成的石頭。死去的獵物\r\n是否仍活在其中？", en = "c0a6824e" }
"itemData.6058" = { text = "獄狼龍的龍鬃", en = "63aa4408" }
"itemData.6059" = { text = "寄宿著蝕龍蟲的鬃毛。\r\n會迸發出\r\n紅黑色的電光。", en = "b5a4d505" }
"itemData.6060" = { text = "獄狼龍的重殼", en = "b38abbc9" }
"itemData.6061" = { text = "獄狼龍的黑色重殼。\r\n這地獄般的甲殼中\r\n潛藏著邪惡的力量。", en = "fe275f2e" }
"itemData.6062" = { text = "獄狼龍的剛角", en = "5de47e67" }
"itemData.6063" = { text = "獄狼龍堅硬的角。\r\n其強大的力量\r\n是否代表著對龍的反抗？", en = "9f2320fe" }
"itemData.6064" = { text = "獄狼龍的剛爪", en = "0dd49402" }
"itemData.6065" = { text = "獄狼龍粗壯的爪。\r\n其力量足以\r\n開闢出絕對霸主的地位。", en = "c9a5b9bb" }
"itemData.6066" = { text = "獄狼龍的蓄龍殼", en = "6e8d1f24" }
"itemData.6067" = { text = "儲存蝕龍蟲之力的甲殼。\r\n蓄積的力量越多，\r\n就能做出越好的裝備。", en = "9ced4913" }
"itemData.6068" = { text = "獄狼龍的韌尾", en = "0cee07d0" }
"itemData.6069" = { text = "獄狼龍強韌得可怕的尾巴。\r\n據說能將\r\n堅固的鋼鐵斬斷。", en = "409a54f8" }
"itemData.6070" = { text = "獄狼龍的天玉", en = "de7a6c80" }
"itemData.6071" = { text = "只有極少數獄狼龍體內\r\n才有的稀有寶玉。\r\n絕對征服者的證明。", en = "a189051f" }
"itemData.6072" = { text = "黑鎧龍的堅殼", en = "bee4e06b" }
"itemData.6073" = { text = "黑鎧龍的堅殼。\r\n呈焦黑色，\r\n很難加工。", en = "19dbfc14" }
"itemData.6074" = { text = "黑鎧龍的頭殼", en = "64678ef2" }
"itemData.6075" = { text = "從黑鎧龍頭部剝取的素材。\r\n看起來就像\r\n可怕的黑色面具。", en = "0a83631e" }
"itemData.6076" = { text = "黑鎧龍的重殼", en = "4f3da829" }
"itemData.6077" = { text = "黑鎧龍沉重的甲殼。\r\n就連灼熱的熔岩\r\n也傷不了這堅固的甲殼。", en = "dbe8966b" }
"itemData.6078" = { text = "黑鎧龍的重頭殼", en = "ce1d9347" }
"itemData.6079" = { text = "能承受強力吐息的\r\n頭部甲殼。\r\n值得研究。", en = "552bf156" }
"itemData.6080" = { text = "黑鎧龍的天殼", en = "99039acf" }
"itemData.6081" = { text = "傳說中的黑鎧龍甲殼。\r\n將其加工者\r\n將統治大地、奪取天空。", en = "f89774b1" }
"itemData.6082" = { text = "一角龍的堅殼", en = "61f4127d" }
"itemData.6083" = { text = "比一角龍的甲殼\r\n更堅硬的部位。\r\n又名「重甲石」。", en = "261e6f2b" }
"itemData.6084" = { text = "一角龍的重殼", en = "43eea0b4" }
"itemData.6085" = { text = "比堅殼更強韌。\r\n當地的獵人\r\n稱之為「縱隔殼」。", en = "12b55897" }
"itemData.6086" = { text = "一角龍的胸甲", en = "1375ce9a" }
"itemData.6087" = { text = "一角龍堅韌的甲殼。\r\n灼熱的沙\r\n使它變得格外堅硬。", en = "0278ee85" }
"itemData.6088" = { text = "一角龍的重甲", en = "ae2f8ccb" }
"itemData.6089" = { text = "一角龍的背甲。\r\n只有最厚的部分\r\n才稱得上「重甲」。", en = "fc359831" }
"itemData.6090" = { text = "緋紅的美角", en = "1bad6df7" }
"itemData.6091" = { text = "一角龍最高級的紅角。\r\n洋溢著\r\n力量與美感。", en = "3fa04fa0" }
"itemData.6092" = { text = "緋紅的剛角", en = "c2a174f7" }
"itemData.6093" = { text = "有著兇猛螺紋的一角龍角。\r\n紅得如同\r\n它奪走的無數生命。", en = "809b93ea" }
"itemData.6094" = { text = "一角龍的心臟", en = "b399a306" }
"itemData.6095" = { text = "一角龍的心臟。\r\n象徵著\r\n純粹的憤怒。", en = "58574810" }
"itemData.6096" = { text = "水蛇龍的厚皮", en = "9bb39989" }
"itemData.6097" = { text = "色彩鮮豔的厚皮。\r\n常用來製作\r\n高級皮革製品，頗受歡迎。", en = "10ed07c2" }
"itemData.6098" = { text = "水蛇龍的重殼", en = "6057921a" }
"itemData.6099" = { text = "堅固而鮮豔的甲殼。\r\n主人疲勞時\r\n警戒色就會褪去。", en = "ddc90191" }
"itemData.6100" = { text = "水蛇龍的水鳴甲", en = "feacf564" }
"itemData.6101" = { text = "亞種特有的特殊鳴甲。\r\n會改變形狀\r\n以引導水流。", en = "636e5203" }
"itemData.6102" = { text = "骸蜘蛛的重殼", en = "c7e5dfad" }
"itemData.6103" = { text = "令人毛骨悚然的甲殼。\r\n品質雖好，但其劇毒般的外觀\r\n令買家大吃一驚。", en = "e35e7974" }
"itemData.6104" = { text = "骸蜘蛛的重鉗角", en = "76990479" }
"itemData.6105" = { text = "又長又鋒利的剪刀狀顎。\r\n足以將獵物\r\n一刀兩斷。", en = "6f9838eb" }
"itemData.6106" = { text = "骸蜘蛛的剛爪", en = "354b4908" }
"itemData.6107" = { text = "骸蜘蛛用來剖開獵物的\r\n出色鉤爪。\r\n令人不寒而慄。", en = "ab7be89a" }
"itemData.6108" = { text = "骸蜘蛛的秘棘", en = "409c7343" }
"itemData.6109" = { text = "毒素凝固而成的\r\n獨特背棘。\r\n毒性與危險性都更強。", en = "1612b3f5" }
