"armorSeriesData.12964" = { text = "暴動X脛甲", en = "1bdc9a5e" }
"armorSeriesData.12965" = { text = "戰勝巨蛇之人啊，\r\n驕傲吧，驕傲吧。\r\n歷史因汝而真正開始。", en = "84aaa3c6" }
"armorSeriesData.12966" = { text = "至高無上之人啊，\r\n純潔吧，純潔吧。\r\n汝之生命如今流淌於眾生。", en = "d39472f8" }
"armorSeriesData.12967" = { text = "擁有無雙之心的人啊，\r\n公正吧，公正吧。\r\n汝將如神明般君臨天下。", en = "511f82a8" }
"armorSeriesData.12968" = { text = "終結永恆時光之人啊，\r\n堅強吧，堅強吧。\r\n汝已將災厄自世間清除。", en = "7a167ae3" }
"armorSeriesData.12969" = { text = "跨越高山大河之人啊，\r\n勇敢吧，勇敢吧。\r\n汝已成為傳說。", en = "adfdd3b9" }
"armorSeriesData.12970" = { text = "叛逆Z頭盔", en = "275a55e1" }
"armorSeriesData.12971" = { text = "叛逆Z鎧甲", en = "99d5fc82" }
"armorSeriesData.12972" = { text = "叛逆Z腕甲", en = "7c7b02b9" }
"armorSeriesData.12973" = { text = "叛逆Z腰甲", en = "8e9818a4" }
"armorSeriesData.12974" = { text = "叛逆Z護腿", en = "c9a39e43" }
"armorSeriesData.12975" = { text = "天上無雙之星啊，\r\n照亮我等前路、指引方向。\r\n讓我等與汝同在直至黎明。", en = "f78fede7" }
"armorSeriesData.12976" = { text = "聳立大地之上的高山啊，\r\n守護並養育我等。\r\n讓我等沐浴於汝之晨曦。", en = "8e632d97" }
"armorSeriesData.12977" = { text = "艷陽下繁茂的大樹啊，\r\n助我等成長、療癒我等。\r\n讓汝之風在正午拂過我等。", en = "e885d179" }
"armorSeriesData.12978" = { text = "廣闊的湖泊啊，\r\n擁抱汝之子民、使我等圓滿。\r\n讓我等沐浴於汝療癒的黃昏。", en = "52f32029" }
"armorSeriesData.12979" = { text = "擎天巨柱啊，\r\n將我等高舉、帶來救贖。\r\n讓我等沐浴於汝之晚霞。", en = "8087f959" }
"armorSeriesData.12980" = { text = "暴動Z帽", en = "d15e6e09" }
"armorSeriesData.12981" = { text = "暴動Z輕甲", en = "4cd7e175" }
"armorSeriesData.12982" = { text = "暴動Z手甲", en = "a6501eb3" }
"armorSeriesData.12983" = { text = "暴動Z護腰", en = "1ee82cb5" }
"armorSeriesData.12984" = { text = "暴動Z脛甲", en = "22568ddc" }
"armorSeriesData.12985" = { text = "地平線上的希望之光啊，\r\n關愛並擁抱我等。\r\n讓我等在一日終了時歸於汝。", en = "f1ffff6b" }
"armorSeriesData.12986" = { text = "神聖的守護之丘啊，\r\n為我等帶來救贖。\r\n讓我等沐浴於汝賜生的落日。", en = "dcf559ed" }
"armorSeriesData.12987" = { text = "覆蓋大地的青草啊，\r\n給予我等庇護。\r\n讓我等在汝寂靜的黃昏中安息。", en = "dd8c609b" }
"armorSeriesData.12988" = { text = "映照星辰的清泉啊，\r\n滋養並療癒我等。\r\n讓世界沐浴於汝之滿月。", en = "44c6dfbf" }
"armorSeriesData.12989" = { text = "光之階梯啊，拯救我等。\r\n讓我等攀著汝穿越夜空，\r\n抵達明日。", en = "9eab5a37" }
"armorSeriesData.12990" = { text = "雷狼龍U頭盔", en = "ad9ecfde" }
"armorSeriesData.12991" = { text = "雷狼龍U鎧甲", en = "a294919c" }
"armorSeriesData.12992" = { text = "雷狼龍U腕甲", en = "f88f687a" }
"armorSeriesData.12993" = { text = "雷狼龍U護裙", en = "7506a3d9" }
"armorSeriesData.12994" = { text = "雷狼龍U護腿", en = "7edd8a59" }
"armorSeriesData.12995" = { text = "討伐獄狼龍的證明，\r\n頭部裝備。\r\n對龍屬性攻擊有很強的抗性。", en = "70b3b1a2" }
"armorSeriesData.12996" = { text = "討伐獄狼龍的證明，\r\n身體裝備。\r\n能有效抵禦古龍的攻擊。", en = "82190f75" }
"armorSeriesData.12997" = { text = "討伐獄狼龍的證明，\r\n腕部裝備。讓穿戴者\r\n如狂暴的古龍般攻擊。", en = "9f9e7250" }
"armorSeriesData.12998" = { text = "討伐獄狼龍的證明，\r\n腰部裝備。以該魔物\r\n強壯的四肢製成。", en = "2dab28d7" }
"armorSeriesData.12999" = { text = "討伐獄狼龍的證明，\r\n腳部裝備。讓雙腿\r\n如那強大的野獸般強壯。", en = "c3ac9714" }
"armorSeriesData.13000" = { text = "雷狼龍U帽", en = "5ced25d6" }
"armorSeriesData.13001" = { text = "雷狼龍U輕甲", en = "ea5d26d7" }
"armorSeriesData.13002" = { text = "雷狼龍U手甲", en = "2d02faa4" }
"armorSeriesData.13003" = { text = "雷狼龍U護腰", en = "be10a096" }
"armorSeriesData.13004" = { text = "雷狼龍U脛甲", en = "108b4a01" }
"armorSeriesData.13005" = { text = "討伐獄狼龍的證明，\r\n頭部裝備。就連兇暴的野獸\r\n也畏懼它的龍屬性能量。", en = "44af798c" }
"armorSeriesData.13006" = { text = "討伐獄狼龍的證明，\r\n身體裝備。從上到下\r\n佈滿了稀有的牙與爪。", en = "bd84a777" }
"armorSeriesData.13007" = { text = "討伐獄狼龍的證明，\r\n腕部裝備。能讓子彈與箭矢\r\n帶上龍屬性能量。", en = "bb5d7a48" }
"armorSeriesData.13008" = { text = "討伐獄狼龍的證明，\r\n腰部裝備。以跳躍力\r\n出名的四肢製成。", en = "c1f4a8b9" }
"armorSeriesData.13009" = { text = "討伐獄狼龍的證明，\r\n腳部裝備。讓雙腿\r\n如飛龍般強壯。", en = "72b566a9" }
"armorSeriesData.13010" = { text = "雷狼龍Z頭盔", en = "1db08531" }
"armorSeriesData.13011" = { text = "雷狼龍Z鎧甲", en = "4fb15402" }
"armorSeriesData.13012" = { text = "雷狼龍Z腕甲", en = "8a28ca50" }
"armorSeriesData.13013" = { text = "雷狼龍Z護裙", en = "88bbb479" }
"armorSeriesData.13014" = { text = "雷狼龍Z護腿", en = "22796945" }
"armorSeriesData.13015" = { text = "源自地獄的強大頭盔。\r\n龍之黑雲\r\n吞噬最後一絲光明。", en = "b77fa1b8" }
"armorSeriesData.13016" = { text = "以漆黑甲片製成的獄狼龍鎧甲。\r\n從內心驅使人\r\n懲罰邪惡。", en = "4ff804b1" }
"armorSeriesData.13017" = { text = "如獄狼龍之怒般迅捷的腕甲。\r\n出擊時\r\n將一切籠罩於黑暗之中。", en = "eaf856a4" }
"armorSeriesData.13018" = { text = "地獄守衛的腰部裝備。\r\n毫不留情地\r\n抹去敵人最後的意念。", en = "d817bb57" }
"armorSeriesData.13019" = { text = "地獄的腳部裝備。\r\n能讓人從地獄深淵\r\n躍過天界最尖的峰頂。", en = "047ec6a7" }
"armorSeriesData.13020" = { text = "雷狼龍Z帽", en = "7eb917fe" }
"armorSeriesData.13021" = { text = "雷狼龍Z輕甲", en = "e50a3fa7" }
"armorSeriesData.13022" = { text = "雷狼龍Z手甲", en = "53a1aa1d" }
"armorSeriesData.13023" = { text = "雷狼龍Z護腰", en = "19af9124" }
"armorSeriesData.13024" = { text = "雷狼龍Z脛甲", en = "9d87a426" }
"armorSeriesData.13025" = { text = "飾有地獄之毛的強大頭盔。\r\n雷聲轟鳴之際，\r\n龍之暴雲使大地昏暗。", en = "95050c23" }
"armorSeriesData.13026" = { text = "怒氣沸騰的地獄鎧甲。\r\n讓空氣為之震動，\r\n見者無不顫慄。", en = "c59c986c" }
"armorSeriesData.13027" = { text = "蘊含地獄之龍氣息的腕甲。\r\n時刻警戒，\r\n嚴厲懲罰。", en = "7e1929bd" }
"armorSeriesData.13028" = { text = "地獄的腰部裝備。\r\n據說穿戴它的守衛\r\n能承受最殘酷的酷刑。", en = "1033fd52" }
"armorSeriesData.13029" = { text = "踢開地獄之門的腳部裝備。\r\n能劈開大地、\r\n撼動天空。", en = "1f566bff" }
"armorSeriesData.13030" = { text = "鎧龍U頭盔", en = "fea2c8e9" }
"armorSeriesData.13031" = { text = "鎧龍U鎧甲", en = "cdee2668" }
"armorSeriesData.13032" = { text = "鎧龍U腕甲", en = "d1e3ebd6" }
"armorSeriesData.13033" = { text = "鎧龍U護裙", en = "c17a4e9e" }
"armorSeriesData.13034" = { text = "鎧龍U護腿", en = "69303e74" }
"armorSeriesData.13035" = { text = "以黑鎧龍素材製成，\r\n堅如岩石的頭部裝備。\r\n能完全擋下魔物的攻擊。", en = "19802999" }
"armorSeriesData.13036" = { text = "以黑鎧龍素材製成的\r\n身體裝備。半吊子的攻擊者\r\n反而會受到傷害。", en = "ccbd024e" }
"armorSeriesData.13037" = { text = "以黑鎧龍素材製成的\r\n腕部裝備。魔物強壯，\r\n裝備就強壯。不必多說。", en = "912f8b30" }
"armorSeriesData.13038" = { text = "以黑鎧龍素材製成的\r\n腰部裝備。又大又重，\r\n防具就該是這樣。", en = "ae6068a0" }
"armorSeriesData.13039" = { text = "以黑鎧龍素材製成的\r\n腳部裝備。\r\n如要塞城門般堅不可破。", en = "902b50a8" }
"armorSeriesData.13040" = { text = "鎧龍U帽", en = "f11db542" }
"armorSeriesData.13041" = { text = "鎧龍U輕甲", en = "29ddb7b5" }
"armorSeriesData.13042" = { text = "鎧龍U手甲", en = "3ae8ea7e" }
"armorSeriesData.13043" = { text = "鎧龍U護腰", en = "79bdd38b" }
"armorSeriesData.13044" = { text = "鎧龍U脛甲", en = "2635c58b" }
"armorSeriesData.13045" = { text = "以黑鎧龍素材製成的\r\n頭部裝備。光是戴上\r\n就能證明誰才是老大。", en = "abbb0bbc" }
"armorSeriesData.13046" = { text = "以黑鎧龍素材製成的\r\n身體裝備。\r\n重視屬性防禦。", en = "cf81fca3" }
"armorSeriesData.13047" = { text = "以黑鎧龍素材製成的\r\n腕部裝備。體積龐大，\r\n卻意外地好活動。", en = "5a4c6f7f" }
"armorSeriesData.13048" = { text = "以黑鎧龍素材製成的\r\n腰部裝備。重得足以\r\n壓裂家裡的地板。", en = "363bda88" }
"armorSeriesData.13049" = { text = "以黑鎧龍素材製成的\r\n防具。讓穿戴者\r\n感覺穩如磐石。", en = "c110492b" }
"armorSeriesData.13050" = { text = "鎧龍Z頭盔", en = "d095a9e9" }
"armorSeriesData.13051" = { text = "鎧龍Z鎧甲", en = "633fd0e3" }
