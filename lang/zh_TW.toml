"2977.desc" = { text = "鱗片縫隙間不斷滲出\r\n重龍骨油，\r\n整片鱗都被油覆蓋著。", en = "96c0526a" }
"2977.name" = { text = "巨戟龍的城牆鱗", en = "b2a53ac4" }
"2978.desc" = { text = "插滿無數武器的甲殼。\r\n每一把都是想奪其性命\r\n卻徒勞無功的證明。", en = "7dc1c827" }
"2978.name" = { text = "巨戟龍的要塞殼", en = "d09c5786" }
"2979.desc" = { text = "沾滿鮮血與油的扭曲刀刃。\r\n鈍化的刃口\r\n不是斬斷而是壓碎。", en = "e6b8ffd6" }
"2979.name" = { text = "巨戟龍的碎刃", en = "87ca2aaf" }
"2980.desc" = { text = "燒得通紅的爪。巨戟龍\r\n用它殘忍地燒灼\r\n長臂所及之處的獵物。", en = "7522116c" }
"2980.name" = { text = "巨戟龍的灼爪", en = "291d3e03" }
"2981.desc" = { text = "破爛得無法掀起風的巨翼。\r\n揮動時只會濺出\r\n混著油的血肉。", en = "090d557c" }
"2981.name" = { text = "巨戟龍的破翼", en = "e93cfa33" }
"2982.desc" = { text = "長滿無數尖刺的尾巴。\r\n凡是看到的人\r\n無不心生恐懼。", en = "69241ec9" }
"2982.name" = { text = "巨戟龍的棘尾", en = "6b482870" }
"2983.desc" = { text = "據說寄宿著神之原火的\r\n珍貴寶玉。一旦碎裂，\r\n世界將陷入火海。", en = "028cc524" }
"2983.name" = { text = "戰火的龍神玉", en = "d2adf30e" }
"2984.desc" = { text = "流遍巨戟龍全身的\r\n危險液體。\r\n遇高熱就會爆炸。", en = "e64c5e23" }
"2984.name" = { text = "重龍骨油", en = "058f595b" }
"2985.desc" = { text = "殘缺的優質素材。\r\n形狀不規則，如果收集起來的話，\r\n能夠製作隨從的武具。", en = "81c36afe" }
"2985.name" = { text = "巨戟龍的上級餘料", en = "982105e8" }
"2986.desc" = { text = "堅硬的厚鱗。光滑的表面\r\n不知是被沙磨出來的，\r\n還是為了沙而生的。", en = "5eea41b2" }
"2986.name" = { text = "虎鮫鯊的厚鱗", en = "cac378fc" }
"2987.desc" = { text = "富有彈性的厚皮，保水性佳，\r\n最適合在沙漠中\r\n狩獵時使用。", en = "f95309f1" }
"2987.name" = { text = "虎鮫鯊的厚皮", en = "3910b55c" }
"2988.desc" = { text = "巨大的背鰭。\r\n在沙海中看到它的商隊\r\n無不心神不寧。", en = "46ad5f85" }
"2988.name" = { text = "虎鮫鯊的特上鰭", en = "fb36de02" }
"2989.desc" = { text = "三角形的牙齒。\r\n與其他牙齒一同咬入，\r\n將獵物鋸開。", en = "d403b2dd" }
"2989.name" = { text = "虎鮫鯊的重鋸齒", en = "3055a1be" }
"2990.desc" = { text = "末端帶有倒鉤的巨大尾巴。\r\n轉眼間就能\r\n將目標掃倒。", en = "a4f10152" }
"2990.name" = { text = "虎鮫鯊的剛刃尾", en = "406aa94d" }
