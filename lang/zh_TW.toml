# Traditional Chinese: the mod's own translation for GU's chT text (zh_TW), the text 4U cannot give (4U has no
# Chinese). Keys are stable IDs, never the English they translate (tools/translate.py: the format, the worksheet,
# the checks). Names carry their source: official = a Capcom Chinese release, community = fan usage; every other
# string is this project's translation (unofficial), using GU's own chT terms.

[monsters]                 # data file NAME, per allocations.toml entry
black_gravios = "黑鎧龍"   # chS official: MH Stories 3; chT its character form; GU Gravios = 鎧龍 / 铠龙
dalamadur = "蛇王龍"       # community (4G fan name, monsterhunterwiki.org): no Chinese release names it
shah_dalamadur = "蛇帝龍"  # community (monsterhunterwiki.org): no Chinese release names it
gogmazios = "巨戟龍"       # official: MH Wilds title update 4 (2025-12-16)
monoblos = "一角龍"        # official: MH Stories 2
shrouded_nerscylla = "骸蜘蛛" # official: MH Stories 2
stygian_zinogre = "獄狼龍" # official: MH World: Iceborne
tidal_najarala = "水蛇龍"  # community (monsterhunterwiki.org): no Chinese release names it
tigerstripe_zamtrios = "虎鮫鯊" # community (monsterhunterwiki.org), GU's own Zamtrios pattern (冰鮫鯊 / 变形冰鲨)

[maps]                     # board = the quest board's and the installer's name (4U has none in Chinese),
                           # full = the full name; community (no Chinese release names them): 天空山 the 4G kanji; 千劍山, 戰鬥街 forum.gamer.com.tw
battlequarters = { board = "戰鬥街", full = "戰鬥街" }
heavens_mount = { board = "天空山", full = "天空山" }
speartip_crag = { board = "千劍山", full = "千劍山" }

[text]                     # generated by tools/translate.py apply: edit there or here, keep `en`
"armorSeriesData.12870" = { text = "巨戟龍頭盔", en = "cd764068" }
"armorSeriesData.12871" = { text = "巨戟龍鎧甲", en = "9eaad6ee" }
"armorSeriesData.12872" = { text = "巨戟龍腕甲", en = "302bf2bb" }
"armorSeriesData.12873" = { text = "巨戟龍護裙", en = "e56a6970" }
"armorSeriesData.12874" = { text = "巨戟龍護腿", en = "9722e5cf" }
"armorSeriesData.12875" = { text = "自冥界爬出的\r\n怪誕面容。\r\n雙眼燃燒著絕望。", en = "a4c8483d" }
"armorSeriesData.12876" = { text = "冥界使者所披的黑暗外衣。\r\n他們為了黑暗的使命\r\n降生於世。", en = "ec564696" }
"armorSeriesData.12877" = { text = "從冥界爬回此世的漆黑手臂，\r\n要將殘存的光明\r\n盡數捏碎。", en = "f537c728" }
"armorSeriesData.12878" = { text = "包覆怪誕使者的一片黑暗。\r\n其絲線會將獵物\r\n拖入陰影之中。", en = "8eefd08a" }
"armorSeriesData.12879" = { text = "冥界使者的腳部裝備。\r\n滲出的黑暗\r\n玷污了純淨的大地。", en = "93905fbe" }
"armorSeriesData.12880" = { text = "巨戟龍帽", en = "0ec44c30" }
"armorSeriesData.12881" = { text = "巨戟龍輕甲", en = "2e00a777" }
"armorSeriesData.12882" = { text = "巨戟龍手甲", en = "fe314e8f" }
"armorSeriesData.12883" = { text = "巨戟龍護腰", en = "95f95407" }
"armorSeriesData.12884" = { text = "巨戟龍脛甲", en = "291cad61" }
"armorSeriesData.12885" = { text = "冥界使者將靈魂\r\n拖入深淵時\r\n所戴的怪誕面具。", en = "9750242a" }
"armorSeriesData.12886" = { text = "上天強加於冥界使者的衣裝，\r\n用以壓制\r\n他們邪惡的靈魂。", en = "1daf489f" }
"armorSeriesData.12887" = { text = "冥界使者的左手之爪。\r\n用來爬過黑暗的泥沼，\r\n伏擊獵物。", en = "dc9a31b8" }
"armorSeriesData.12888" = { text = "怪誕使者的屍衣。\r\n使白晝化為黑暗，\r\n熄滅生命的光輝。", en = "ae8d60e5" }
"armorSeriesData.12889" = { text = "黑暗使者的腳部裝備。\r\n大地在其腳下裂開，\r\n形成深邃的陰影。", en = "c3022574" }
"armorSeriesData.12890" = { text = "冰鮫鯊Z頭盔", en = "888e52af" }
"armorSeriesData.12891" = { text = "冰鮫鯊Z鎧甲", en = "1f42dab4" }
"armorSeriesData.12892" = { text = "冰鮫鯊Z腕甲", en = "2f372460" }
"armorSeriesData.12893" = { text = "冰鮫鯊Z護裙", en = "703aefea" }
"armorSeriesData.12894" = { text = "冰鮫鯊Z護腿", en = "a7a6ce6a" }
"armorSeriesData.12895" = { text = "以富有彈性的虎鮫鯊素材\r\n製成的頭部裝備。\r\n在嚴酷氣候中無與倫比。", en = "caad6a1c" }
"armorSeriesData.12896" = { text = "以虎鮫鯊素材製成的\r\n身體裝備。爆發般的氣勢\r\n令敵人絕望逃竄。", en = "d3f5afbf" }
"armorSeriesData.12897" = { text = "以虎鮫鯊素材製成的\r\n腕部裝備。減少阻力，\r\n讓穿戴者能戲弄獵物。", en = "3f73c96f" }
"armorSeriesData.12898" = { text = "以虎鮫鯊素材製成的\r\n腰部裝備。精練的造型\r\n讓動作更加優雅。", en = "803ff746" }
"armorSeriesData.12899" = { text = "以虎鮫鯊素材製成的\r\n腳部裝備。頂級的彈性素材\r\n提升運動能力。", en = "0d46b594" }
"armorSeriesData.12900" = { text = "冰鮫鯊Z帽", en = "3276f2c5" }
"armorSeriesData.12901" = { text = "冰鮫鯊Z輕甲", en = "9db0d247" }
"armorSeriesData.12902" = { text = "冰鮫鯊Z手甲", en = "ce64f43d" }
"armorSeriesData.12903" = { text = "冰鮫鯊Z護腰", en = "fb8f8243" }
"armorSeriesData.12904" = { text = "冰鮫鯊Z脛甲", en = "7fdb07a0" }
"armorSeriesData.12905" = { text = "以富有彈性的虎鮫鯊素材\r\n製成的頭部裝備。\r\n令見者喪失勇氣。", en = "40ee916a" }
"armorSeriesData.12906" = { text = "以虎鮫鯊素材製成的\r\n身體裝備。如閃電般的甲片\r\n驅使獵人勇往直前。", en = "34e36edd" }
"armorSeriesData.12907" = { text = "以虎鮫鯊素材製成的\r\n腕部裝備。凶猛的裝飾\r\n令敵人失去鬥志。", en = "ded35181" }
"armorSeriesData.12908" = { text = "以虎鮫鯊素材製成的\r\n腰部裝備。厚實的甲片\r\n讓人化身行走的要塞。", en = "0772f4d7" }
"armorSeriesData.12909" = { text = "以虎鮫鯊素材製成的\r\n腳部裝備。舒適的穿著感\r\n能引出真正的潛力。", en = "439792e9" }
"armorSeriesData.12910" = { text = "叛逆頭盔", en = "847024a6" }
"armorSeriesData.12911" = { text = "叛逆鎧甲", en = "6997263e" }
"armorSeriesData.12912" = { text = "叛逆腕甲", en = "6973214d" }
"armorSeriesData.12913" = { text = "叛逆腰甲", en = "5209a6bf" }
"armorSeriesData.12914" = { text = "叛逆護腿", en = "8b964e53" }
"armorSeriesData.12915" = { text = "見證化為現實的傳說吧，\r\n此乃討伐蛇王龍之\r\n英雄的證明。", en = "4eed7ee0" }
"armorSeriesData.12916" = { text = "說出汝之所願吧，\r\n造物者將以千劍\r\n守護汝身。", en = "090ea7ab" }
"armorSeriesData.12917" = { text = "引以為傲吧，\r\n造物者已認可汝\r\n配得上蛇王龍之臂。", en = "e7c02dc6" }
"armorSeriesData.12918" = { text = "說出汝之所望吧，\r\n吞海巨物將以龍息\r\n環繞汝身。", en = "aa8f8221" }
"armorSeriesData.12919" = { text = "說出汝之所想吧，\r\n汝所追求的，\r\n是龍那不動如山的雙足嗎？", en = "0309e58c" }
"armorSeriesData.12920" = { text = "暴動帽", en = "2dc5f499" }
"armorSeriesData.12921" = { text = "暴動輕甲", en = "44f6e3e2" }
"armorSeriesData.12922" = { text = "暴動手甲", en = "80d79c80" }
"armorSeriesData.12923" = { text = "暴動護腰", en = "01bb4503" }
"armorSeriesData.12924" = { text = "暴動脛甲", en = "37211ad2" }
"armorSeriesData.12925" = { text = "謙卑吧，\r\n戴上此冠的獵人\r\n已通過堪稱傳說的試煉。", en = "c0a5300a" }
"armorSeriesData.12926" = { text = "無須掩飾汝之驕傲，\r\n此乃時間之基石，\r\n將守護汝之性命。", en = "eceebdfe" }
"armorSeriesData.12927" = { text = "展現汝之剛毅吧，\r\n汝之雙臂須如巨刃，\r\n擊退一切加害者。", en = "41ae7999" }
"armorSeriesData.12928" = { text = "展現汝之威嚴吧，\r\n永世之龍的鱗片\r\n將護汝遠離災厄。", en = "1ceebd09" }
"armorSeriesData.12929" = { text = "展現汝之風雅吧，\r\n讓汝之足跡\r\n造就山岳與傳說。", en = "344c86a3" }
"armorSeriesData.12930" = { text = "EX叛逆頭盔", en = "a02c06ad" }
"armorSeriesData.12931" = { text = "EX叛逆鎧甲", en = "35d558b5" }
"armorSeriesData.12932" = { text = "EX叛逆腕甲", en = "4ef63403" }
"armorSeriesData.12933" = { text = "EX叛逆腰甲", en = "f50dc557" }
"armorSeriesData.12934" = { text = "EX叛逆護腿", en = "ce662610" }
"armorSeriesData.12935" = { text = "以蛇王龍素材鍛造的\r\n珍奇頭部裝備。\r\n展現出全新的性能。", en = "b3b82bfe" }
"armorSeriesData.12936" = { text = "以蛇王龍素材鍛造的\r\n珍奇身體裝備。\r\n展現出全新的性能。", en = "c358c0e7" }
"armorSeriesData.12937" = { text = "以蛇王龍素材鍛造的\r\n珍奇腕部裝備。\r\n展現出全新的性能。", en = "e7b21f47" }
"armorSeriesData.12938" = { text = "以蛇王龍素材鍛造的\r\n珍奇腰部裝備。\r\n展現出全新的性能。", en = "942a5506" }
