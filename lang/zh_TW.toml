"armorSeriesData.12904" = { text = "冰鮫鯊Z脛甲", en = "7fdb07a0" }
"armorSeriesData.12905" = { text = "以富有彈性的虎鮫鯊素材\r\n製成的頭部裝備。\r\n令見者喪失勇氣。", en = "40ee916a" }
"armorSeriesData.12906" = { text = "以虎鮫鯊素材製成的\r\n身體裝備。如閃電般的甲片\r\n驅使獵人勇往直前。", en = "34e36edd" }
"armorSeriesData.12907" = { text = "以虎鮫鯊素材製成的\r\n腕部裝備。凶猛的裝飾\r\n令敵人失去鬥志。", en = "ded35181" }
"armorSeriesData.12908" = { text = "以虎鮫鯊素材製成的\r\n腰部裝備。厚實的甲片\r\n讓人化身行走的要塞。", en = "0772f4d7" }
"armorSeriesData.12909" = { text = "以虎鮫鯊素材製成的\r\n腳部裝備。舒適的穿著感\r\n能引出真正的潛力。", en = "439792e9" }
"armorSeriesData.12910" = { text = "叛逆頭盔", en = "847024a6" }
"armorSeriesData.12911" = { text = "叛逆鎧甲", en = "6997263e" }
"armorSeriesData.12912" = { text = "叛逆腕甲", en = "6973214d" }
"armorSeriesData.12913" = { text = "叛逆腰甲", en = "5209a6bf" }
"armorSeriesData.12914" = { text = "叛逆護腿", en = "8b964e53" }
"armorSeriesData.12915" = { text = "見證化為現實的傳說吧，\r\n此乃討伐蛇王龍之\r\n英雄的證明。", en = "4eed7ee0" }
"armorSeriesData.12916" = { text = "說出汝之所願吧，\r\n造物者將以千劍\r\n守護汝身。", en = "090ea7ab" }
"armorSeriesData.12917" = { text = "引以為傲吧，\r\n造物者已認可汝\r\n配得上蛇王龍之臂。", en = "e7c02dc6" }
"armorSeriesData.12918" = { text = "說出汝之所望吧，\r\n吞海巨物將以龍息\r\n環繞汝身。", en = "aa8f8221" }
"armorSeriesData.12919" = { text = "說出汝之所想吧，\r\n汝所追求的，\r\n是龍那不動如山的雙足嗎？", en = "0309e58c" }
"armorSeriesData.12920" = { text = "暴動帽", en = "2dc5f499" }
"armorSeriesData.12921" = { text = "暴動輕甲", en = "44f6e3e2" }
"armorSeriesData.12922" = { text = "暴動手甲", en = "80d79c80" }
"armorSeriesData.12923" = { text = "暴動護腰", en = "01bb4503" }
"armorSeriesData.12924" = { text = "暴動脛甲", en = "37211ad2" }
"armorSeriesData.12925" = { text = "謙卑吧，\r\n戴上此冠的獵人\r\n已通過堪稱傳說的試煉。", en = "c0a5300a" }
"armorSeriesData.12926" = { text = "無須掩飾汝之驕傲，\r\n此乃時間之基石，\r\n將守護汝之性命。", en = "eceebdfe" }
"armorSeriesData.12927" = { text = "展現汝之剛毅吧，\r\n汝之雙臂須如巨刃，\r\n擊退一切加害者。", en = "41ae7999" }
"armorSeriesData.12928" = { text = "展現汝之威嚴吧，\r\n永世之龍的鱗片\r\n將護汝遠離災厄。", en = "1ceebd09" }
"armorSeriesData.12929" = { text = "展現汝之風雅吧，\r\n讓汝之足跡\r\n造就山岳與傳說。", en = "344c86a3" }
