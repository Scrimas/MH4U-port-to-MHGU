monoblos = "一角龍"        # official: MH Stories 2
shrouded_nerscylla = "骸蜘蛛" # official: MH Stories 2
stygian_zinogre = "獄狼龍" # official: MH World: Iceborne
tidal_najarala = "水蛇龍"  # community (monsterhunterwiki.org): no Chinese release names it
tigerstripe_zamtrios = "虎鮫鯊" # community (monsterhunterwiki.org), GU's own Zamtrios pattern (冰鮫鯊 / 变形冰鲨)
