"armorSeriesData.12955" = { text = "征服巨蛇之人啊，\r\n受祝福吧，受祝福吧。\r\n汝之英勇事蹟將永世流傳。", en = "a25dc71a" }
"armorSeriesData.12956" = { text = "統御天地之人啊，\r\n受頌揚吧，受頌揚吧。\r\n光明誕生於汝千劍的閃耀中。", en = "e9f6f67f" }
"armorSeriesData.12957" = { text = "自天而降的戰士啊，\r\n受尊崇吧，受尊崇吧。\r\n世間一切榮耀皆歸於汝。", en = "2147629d" }
"armorSeriesData.12958" = { text = "支配大海之人啊，\r\n歡欣吧，歡欣吧。\r\n汝將被稱為萬物之始。", en = "124c4c34" }
"armorSeriesData.12959" = { text = "撼動長空之人啊，\r\n受讚美吧，受讚美吧。\r\n汝乃宇宙萬有的象徵。", en = "3fab95fd" }
"armorSeriesData.12960" = { text = "暴動X帽", en = "4dbf8501" }
"armorSeriesData.12961" = { text = "暴動X輕甲", en = "1137d2ff" }
"armorSeriesData.12962" = { text = "暴動X手甲", en = "926a585c" }
