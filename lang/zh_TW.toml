"armorSeriesData.13058" = { text = "以黑鎧龍素材製成的\r\n腰部裝備。又大又重，\r\n防具就該是這樣。", en = "ae6068a0" }
"armorSeriesData.13059" = { text = "以黑鎧龍素材製成的\r\n腳部裝備。\r\n如要塞城門般堅不可破。", en = "902b50a8" }
