# Simplified Chinese: the mod's own translation for GU's chS text (zh_CN), the text 4U cannot give (4U has no
# Chinese). Keys are stable IDs, never the English they translate (tools/translate.py: the format, the worksheet,
# the checks). Names carry their source: official = a Capcom Chinese release, community = fan usage; every other
# string is this project's translation (unofficial), using GU's own chS terms.

[monsters]                 # data file NAME, per allocations.toml entry
black_gravios = "黑铠龙"   # chS official: MH Stories 3; chT its character form; GU Gravios = 鎧龍 / 铠龙
dalamadur = "蛇王龙"       # community (4G fan name, monsterhunterwiki.org): no Chinese release names it
shah_dalamadur = "蛇帝龙"  # community (monsterhunterwiki.org): no Chinese release names it
gogmazios = "巨戟龙"       # official: MH Wilds title update 4 (2025-12-16)
monoblos = "一角龙"        # official: MH Stories 2
shrouded_nerscylla = "骸蜘蛛" # official: MH Stories 2
stygian_zinogre = "狱狼龙" # official: MH World: Iceborne
tidal_najarala = "水蛇龙"  # community (monsterhunterwiki.org): no Chinese release names it
tigerstripe_zamtrios = "变形虎鲨" # community (monsterhunterwiki.org), GU's own Zamtrios pattern (冰鮫鯊 / 变形冰鲨)

[maps]                     # board = the quest board's and the installer's name (4U has none in Chinese),
                           # full = the full name; community (no Chinese release names them): 天空山 the 4G kanji; 千剑山 moegirl, 战斗街 baike.baidu.com
battlequarters = { board = "战斗街", full = "战斗街" }
heavens_mount = { board = "天空山", full = "天空山" }
speartip_crag = { board = "千剑山", full = "千剑山" }

[text]                     # generated by tools/translate.py apply: edit there or here, keep `en`
"armorSeriesData.12870" = { text = "巨戟龙头盔", en = "cd764068" }
"armorSeriesData.12871" = { text = "巨戟龙铠甲", en = "9eaad6ee" }
"armorSeriesData.12872" = { text = "巨戟龙腕甲", en = "302bf2bb" }
"armorSeriesData.12873" = { text = "巨戟龙护裙", en = "e56a6970" }
"armorSeriesData.12874" = { text = "巨戟龙护腿", en = "9722e5cf" }
"armorSeriesData.12875" = { text = "自冥界爬出的怪诞面容。\r\n双眼燃烧着绝望。", en = "a4c8483d" }
"armorSeriesData.12876" = { text = "冥界使者所披的黑暗外衣。\r\n他们为了黑暗的使命降生于世。", en = "ec564696" }
"armorSeriesData.12877" = { text = "从冥界爬回此世的漆黑手臂，\r\n要将残存的光明尽数捏碎。", en = "f537c728" }
"armorSeriesData.12878" = { text = "包覆怪诞使者的一片黑暗。\r\n其丝线会将猎物拖入阴影之中。", en = "8eefd08a" }
"armorSeriesData.12879" = { text = "冥界使者的脚部装备。\r\n渗出的黑暗玷污了纯净的大地。", en = "93905fbe" }
"armorSeriesData.12880" = { text = "巨戟龙帽", en = "0ec44c30" }
"armorSeriesData.12881" = { text = "巨戟龙轻甲", en = "2e00a777" }
"armorSeriesData.12882" = { text = "巨戟龙手甲", en = "fe314e8f" }
"armorSeriesData.12883" = { text = "巨戟龙护腰", en = "95f95407" }
"armorSeriesData.12884" = { text = "巨戟龙胫甲", en = "291cad61" }
"armorSeriesData.12885" = { text = "冥界使者将灵魂拖入深渊时\r\n所戴的怪诞面具。", en = "9750242a" }
"armorSeriesData.12886" = { text = "上天强加于冥界使者的衣装，\r\n用以压制他们邪恶的灵魂。", en = "1daf489f" }
"armorSeriesData.12887" = { text = "冥界使者的左手之爪。\r\n用来爬过黑暗的泥沼，伏击猎物。", en = "dc9a31b8" }
"armorSeriesData.12888" = { text = "怪诞使者的尸衣。\r\n使白昼化为黑暗，熄灭生命的光辉。", en = "ae8d60e5" }
"armorSeriesData.12889" = { text = "黑暗使者的脚部装备。\r\n大地在其脚下裂开，形成深邃的阴影。", en = "c3022574" }
"armorSeriesData.12890" = { text = "变形冰鲨Z头盔", en = "888e52af" }
"armorSeriesData.12891" = { text = "变形冰鲨Z铠甲", en = "1f42dab4" }
"armorSeriesData.12892" = { text = "变形冰鲨Z腕甲", en = "2f372460" }
"armorSeriesData.12893" = { text = "变形冰鲨Z护裙", en = "703aefea" }
"armorSeriesData.12894" = { text = "变形冰鲨Z护腿", en = "a7a6ce6a" }
"armorSeriesData.12895" = { text = "以富有弹性的变形虎鲨素材\r\n制成的头部装备。\r\n在严酷气候中无与伦比。", en = "caad6a1c" }
"armorSeriesData.12896" = { text = "以变形虎鲨素材制成的身体装备。\r\n爆发般的气势令敌人绝望逃窜。", en = "d3f5afbf" }
"armorSeriesData.12897" = { text = "以变形虎鲨素材制成的腕部装备。\r\n减少阻力，让穿戴者能戏弄猎物。", en = "3f73c96f" }
"armorSeriesData.12898" = { text = "以变形虎鲨素材制成的腰部装备。\r\n精炼的造型让动作更加优雅。", en = "803ff746" }
"armorSeriesData.12899" = { text = "以变形虎鲨素材制成的脚部装备。\r\n顶级的弹性素材提升运动能力。", en = "0d46b594" }
"armorSeriesData.12900" = { text = "变形冰鲨Z帽", en = "3276f2c5" }
"armorSeriesData.12901" = { text = "变形冰鲨Z轻甲", en = "9db0d247" }
"armorSeriesData.12902" = { text = "变形冰鲨Z手甲", en = "ce64f43d" }
"armorSeriesData.12903" = { text = "变形冰鲨Z护腰", en = "fb8f8243" }
"armorSeriesData.12904" = { text = "变形冰鲨Z胫甲", en = "7fdb07a0" }
"armorSeriesData.12905" = { text = "以富有弹性的变形虎鲨素材\r\n制成的头部装备。\r\n令见者丧失勇气。", en = "40ee916a" }
"armorSeriesData.12906" = { text = "以变形虎鲨素材制成的身体装备。\r\n如闪电般的甲片驱使猎人勇往直前。", en = "34e36edd" }
"armorSeriesData.12907" = { text = "以变形虎鲨素材制成的腕部装备。\r\n凶猛的装饰令敌人失去斗志。", en = "ded35181" }
"armorSeriesData.12908" = { text = "以变形虎鲨素材制成的腰部装备。\r\n厚实的甲片让人化身行走的要塞。", en = "0772f4d7" }
"armorSeriesData.12909" = { text = "以变形虎鲨素材制成的脚部装备。\r\n舒适的穿着感能引出真正的潜力。", en = "439792e9" }
"armorSeriesData.12910" = { text = "叛逆头盔", en = "847024a6" }
"armorSeriesData.12911" = { text = "叛逆铠甲", en = "6997263e" }
"armorSeriesData.12912" = { text = "叛逆腕甲", en = "6973214d" }
"armorSeriesData.12913" = { text = "叛逆腰甲", en = "5209a6bf" }
"armorSeriesData.12914" = { text = "叛逆护腿", en = "8b964e53" }
"armorSeriesData.12915" = { text = "见证化为现实的传说吧，\r\n此乃讨伐蛇王龙之英雄的证明。", en = "4eed7ee0" }
"armorSeriesData.12916" = { text = "说出汝之所愿吧，\r\n造物者将以千剑守护汝身。", en = "090ea7ab" }
"armorSeriesData.12917" = { text = "引以为傲吧，\r\n造物者已认可汝配得上蛇王龙之臂。", en = "e7c02dc6" }
"armorSeriesData.12918" = { text = "说出汝之所望吧，\r\n吞海巨物将以龙息环绕汝身。", en = "aa8f8221" }
"armorSeriesData.12919" = { text = "说出汝之所想吧，\r\n汝所追求的，\r\n是龙那不动如山的双足吗？", en = "0309e58c" }
"armorSeriesData.12920" = { text = "暴动帽", en = "2dc5f499" }
"armorSeriesData.12921" = { text = "暴动轻甲", en = "44f6e3e2" }
"armorSeriesData.12922" = { text = "暴动手甲", en = "80d79c80" }
"armorSeriesData.12923" = { text = "暴动护腰", en = "01bb4503" }
"armorSeriesData.12924" = { text = "暴动胫甲", en = "37211ad2" }
"armorSeriesData.12925" = { text = "谦卑吧，戴上此冠的猎人\r\n已通过堪称传说的试炼。", en = "c0a5300a" }
"armorSeriesData.12926" = { text = "无须掩饰汝之骄傲，\r\n此乃时间之基石，将守护汝之性命。", en = "eceebdfe" }
"armorSeriesData.12927" = { text = "展现汝之刚毅吧，\r\n汝之双臂须如巨刃，击退一切加害者。", en = "41ae7999" }
"armorSeriesData.12928" = { text = "展现汝之威严吧，\r\n永世之龙的鳞片将护汝远离灾厄。", en = "1ceebd09" }
"armorSeriesData.12929" = { text = "展现汝之风雅吧，\r\n让汝之足迹造就山岳与传说。", en = "344c86a3" }
