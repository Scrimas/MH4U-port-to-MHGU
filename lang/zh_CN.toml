"armorSeriesData.12945" = { text = "以蛇王龙素材锻造的珍奇头部装备。\r\n展现出全新的性能。", en = "b3b82bfe" }
"armorSeriesData.12946" = { text = "以蛇王龙素材锻造的珍奇身体装备。\r\n展现出全新的性能。", en = "c358c0e7" }
