"armorSeriesData.13015" = { text = "源自地狱的强大头盔。\r\n龙之黑云吞噬最后一丝光明。", en = "b77fa1b8" }
"armorSeriesData.13016" = { text = "以漆黑甲片制成的狱狼龙铠甲。\r\n从内心驱使人惩罚邪恶。", en = "4ff804b1" }
"armorSeriesData.13017" = { text = "如狱狼龙之怒般迅捷的腕甲。\r\n出击时将一切笼罩于黑暗之中。", en = "eaf856a4" }
"armorSeriesData.13018" = { text = "地狱守卫的腰部装备。\r\n毫不留情地抹去敌人最后的意念。", en = "d817bb57" }
"armorSeriesData.13019" = { text = "地狱的脚部装备。\r\n能让人从地狱深渊\r\n跃过天界最尖的峰顶。", en = "047ec6a7" }
"armorSeriesData.13020" = { text = "雷狼龙Z帽", en = "7eb917fe" }
"armorSeriesData.13021" = { text = "雷狼龙Z轻甲", en = "e50a3fa7" }
"armorSeriesData.13022" = { text = "雷狼龙Z手甲", en = "53a1aa1d" }
