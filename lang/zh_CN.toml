"armorSeriesData.13024" = { text = "雷狼龙Z胫甲", en = "9d87a426" }
"armorSeriesData.13025" = { text = "饰有地狱之毛的强大头盔。\r\n雷声轰鸣之际，龙之暴云使大地昏暗。", en = "95050c23" }
