"armorSeriesData.13004" = { text = "雷狼龙U胫甲", en = "108b4a01" }
"armorSeriesData.13005" = { text = "讨伐狱狼龙的证明，头部装备。\r\n就连凶暴的野兽\r\n也畏惧它的龙属性能量。", en = "44af798c" }
"armorSeriesData.13006" = { text = "讨伐狱狼龙的证明，身体装备。\r\n从上到下布满了稀有的牙与爪。", en = "bd84a777" }
"armorSeriesData.13007" = { text = "讨伐狱狼龙的证明，腕部装备。\r\n能让子弹与箭矢带上龙属性能量。", en = "bb5d7a48" }
"armorSeriesData.13008" = { text = "讨伐狱狼龙的证明，腰部装备。\r\n以跳跃力出名的四肢制成。", en = "c1f4a8b9" }
"armorSeriesData.13009" = { text = "讨伐狱狼龙的证明，脚部装备。\r\n让双腿如飞龙般强壮。", en = "72b566a9" }
