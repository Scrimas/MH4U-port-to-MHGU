"armorSeriesData.12950" = { text = "叛逆X头盔", en = "8efb9242" }
"armorSeriesData.12951" = { text = "叛逆X铠甲", en = "ab00a385" }
"armorSeriesData.12952" = { text = "叛逆X腕甲", en = "7d835dc4" }
"armorSeriesData.12953" = { text = "叛逆X腰甲", en = "a396c1c6" }
"armorSeriesData.12954" = { text = "叛逆X护腿", en = "9eb45825" }
"armorSeriesData.12955" = { text = "征服巨蛇之人啊，\r\n受祝福吧，受祝福吧。\r\n汝之英勇事迹将永世流传。", en = "a25dc71a" }
"armorSeriesData.12956" = { text = "统御天地之人啊，\r\n受颂扬吧，受颂扬吧。\r\n光明诞生于汝千剑的闪耀中。", en = "e9f6f67f" }
"armorSeriesData.12957" = { text = "自天而降的战士啊，\r\n受尊崇吧，受尊崇吧。\r\n世间一切荣耀皆归于汝。", en = "2147629d" }
"armorSeriesData.12958" = { text = "支配大海之人啊，\r\n欢欣吧，欢欣吧。\r\n汝将被称为万物之始。", en = "124c4c34" }
"armorSeriesData.12959" = { text = "撼动长空之人啊，\r\n受赞美吧，受赞美吧。\r\n汝乃宇宙万有的象征。", en = "3fab95fd" }
"armorSeriesData.12960" = { text = "暴动X帽", en = "4dbf8501" }
"armorSeriesData.12961" = { text = "暴动X轻甲", en = "1137d2ff" }
"armorSeriesData.12962" = { text = "暴动X手甲", en = "926a585c" }
"armorSeriesData.12963" = { text = "暴动X护腰", en = "d5873be1" }
"armorSeriesData.12964" = { text = "暴动X胫甲", en = "1bdc9a5e" }
"armorSeriesData.12965" = { text = "战胜巨蛇之人啊，\r\n骄傲吧，骄傲吧。\r\n历史因汝而真正开始。", en = "84aaa3c6" }
"armorSeriesData.12966" = { text = "至高无上之人啊，\r\n纯洁吧，纯洁吧。\r\n汝之生命如今流淌于众生。", en = "d39472f8" }
"armorSeriesData.12967" = { text = "拥有无双之心的人啊，\r\n公正吧，公正吧。\r\n汝将如神明般君临天下。", en = "511f82a8" }
"armorSeriesData.12968" = { text = "终结永恒时光之人啊，\r\n坚强吧，坚强吧。\r\n汝已将灾厄自世间清除。", en = "7a167ae3" }
"armorSeriesData.12969" = { text = "跨越高山大河之人啊，\r\n勇敢吧，勇敢吧。\r\n汝已成为传说。", en = "adfdd3b9" }
"armorSeriesData.12970" = { text = "叛逆Z头盔", en = "275a55e1" }
"armorSeriesData.12971" = { text = "叛逆Z铠甲", en = "99d5fc82" }
"armorSeriesData.12972" = { text = "叛逆Z腕甲", en = "7c7b02b9" }
"armorSeriesData.12973" = { text = "叛逆Z腰甲", en = "8e9818a4" }
"armorSeriesData.12974" = { text = "叛逆Z护腿", en = "c9a39e43" }
"armorSeriesData.12975" = { text = "天上无双之星啊，\r\n照亮我等前路、指引方向。\r\n让我等与汝同在直至黎明。", en = "f78fede7" }
"armorSeriesData.12976" = { text = "耸立大地之上的高山啊，\r\n守护并养育我等。\r\n让我等沐浴于汝之晨曦。", en = "8e632d97" }
"armorSeriesData.12977" = { text = "艳阳下繁茂的大树啊，\r\n助我等成长、疗愈我等。\r\n让汝之风在正午拂过我等。", en = "e885d179" }
"armorSeriesData.12978" = { text = "广阔的湖泊啊，\r\n拥抱汝之子民、使我等圆满。\r\n让我等沐浴于汝疗愈的黄昏。", en = "52f32029" }
"armorSeriesData.12979" = { text = "擎天巨柱啊，\r\n将我等高举、带来救赎。\r\n让我等沐浴于汝之晚霞。", en = "8087f959" }
"armorSeriesData.12980" = { text = "暴动Z帽", en = "d15e6e09" }
"armorSeriesData.12981" = { text = "暴动Z轻甲", en = "4cd7e175" }
"armorSeriesData.12982" = { text = "暴动Z手甲", en = "a6501eb3" }
"armorSeriesData.12983" = { text = "暴动Z护腰", en = "1ee82cb5" }
"armorSeriesData.12984" = { text = "暴动Z胫甲", en = "22568ddc" }
"armorSeriesData.12985" = { text = "地平线上的希望之光啊，\r\n关爱并拥抱我等。\r\n让我等在一日终了时归于汝。", en = "f1ffff6b" }
"armorSeriesData.12986" = { text = "神圣的守护之丘啊，\r\n为我等带来救赎。\r\n让我等沐浴于汝赐生的落日。", en = "dcf559ed" }
"armorSeriesData.12987" = { text = "覆盖大地的青草啊，\r\n给予我等庇护。\r\n让我等在汝寂静的黄昏中安息。", en = "dd8c609b" }
"armorSeriesData.12988" = { text = "映照星辰的清泉啊，\r\n滋养并疗愈我等。\r\n让世界沐浴于汝之满月。", en = "44c6dfbf" }
"armorSeriesData.12989" = { text = "光之阶梯啊，拯救我等。\r\n让我等攀着汝穿越夜空，抵达明日。", en = "9eab5a37" }
"armorSeriesData.12990" = { text = "雷狼龙U头盔", en = "ad9ecfde" }
"armorSeriesData.12991" = { text = "雷狼龙U铠甲", en = "a294919c" }
"armorSeriesData.12992" = { text = "雷狼龙U腕甲", en = "f88f687a" }
"armorSeriesData.12993" = { text = "雷狼龙U护裙", en = "7506a3d9" }
"armorSeriesData.12994" = { text = "雷狼龙U护腿", en = "7edd8a59" }
"armorSeriesData.12995" = { text = "讨伐狱狼龙的证明，头部装备。\r\n对龙属性攻击有很强的抗性。", en = "70b3b1a2" }
"armorSeriesData.12996" = { text = "讨伐狱狼龙的证明，身体装备。\r\n能有效抵御古龙的攻击。", en = "82190f75" }
"armorSeriesData.12997" = { text = "讨伐狱狼龙的证明，腕部装备。\r\n让穿戴者如狂暴的古龙般攻击。", en = "9f9e7250" }
"armorSeriesData.12998" = { text = "讨伐狱狼龙的证明，腰部装备。\r\n以该怪物强壮的四肢制成。", en = "2dab28d7" }
"armorSeriesData.12999" = { text = "讨伐狱狼龙的证明，脚部装备。\r\n让双腿如那强大的野兽般强壮。", en = "c3ac9714" }
