"2978.name" = { text = "巨戟龙的要塞壳", en = "d09c5786" }
"2979.desc" = { text = "沾满鲜血与油的扭曲刀刃。\r\n钝化的刃口不是斩断而是压碎。", en = "e6b8ffd6" }
"2979.name" = { text = "巨戟龙的碎刃", en = "87ca2aaf" }
"2980.desc" = { text = "烧得通红的爪。巨戟龙用它\r\n残忍地烧灼长臂所及之处的猎物。", en = "7522116c" }
"2980.name" = { text = "巨戟龙的灼爪", en = "291d3e03" }
"2981.desc" = { text = "破烂得无法掀起风的巨翼。\r\n挥动时只会溅出混着油的血肉。", en = "090d557c" }
"2981.name" = { text = "巨戟龙的破翼", en = "e93cfa33" }
"2982.desc" = { text = "长满无数尖刺的尾巴。\r\n凡是看到的人无不心生恐惧。", en = "69241ec9" }
"2982.name" = { text = "巨戟龙的棘尾", en = "6b482870" }
"2983.desc" = { text = "据说寄宿着神之原火的珍贵宝玉。\r\n一旦碎裂，世界将陷入火海。", en = "028cc524" }
"2983.name" = { text = "战火的龙神玉", en = "d2adf30e" }
"2984.desc" = { text = "流遍巨戟龙全身的危险液体。\r\n遇到高温就会爆炸。", en = "e64c5e23" }
"2984.name" = { text = "重龙骨油", en = "058f595b" }
"2985.desc" = { text = "残缺的优质素材。\r\n形状不规整，\r\n但收集起来可以制作随从用的武具。", en = "81c36afe" }
"2985.name" = { text = "巨戟龙的上等余料", en = "982105e8" }
"2986.desc" = { text = "坚硬的厚鳞。光滑的表面\r\n不知是被沙磨出来的，还是为沙而生。", en = "5eea41b2" }
"2986.name" = { text = "变形虎鲨的厚鳞", en = "cac378fc" }
"2987.desc" = { text = "富有弹性的厚皮，保水性佳，\r\n最适合在沙漠中狩猎时使用。", en = "f95309f1" }
"2987.name" = { text = "变形虎鲨的厚皮", en = "3910b55c" }
"2988.desc" = { text = "巨大的背鳍。\r\n在沙海中看到它的商队无不心神不宁。", en = "46ad5f85" }
"2988.name" = { text = "变形虎鲨的特等鳍", en = "fb36de02" }
"2989.desc" = { text = "三角形的牙齿。\r\n与其他牙齿一同咬入，将猎物锯开。", en = "d403b2dd" }
"2989.name" = { text = "变形虎鲨的重锯齿", en = "3055a1be" }
"2990.desc" = { text = "末端带有倒钩的巨大尾巴。\r\n转眼间就能将目标扫倒。", en = "a4f10152" }
"2990.name" = { text = "变形虎鲨的刚刃尾", en = "406aa94d" }
