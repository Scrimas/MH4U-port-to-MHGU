"armorSeriesData.13143" = { text = "影蜘蛛Z护腰", en = "f02961f6" }
"armorSeriesData.13144" = { text = "影蜘蛛Z胫甲", en = "0fe3a5ee" }
"armorSeriesData.13145" = { text = "以骸蜘蛛素材制成的威严头部装备。\r\n对称的造型象征至高的骑士道。", en = "be87d0b2" }
"armorSeriesData.13146" = { text = "以骸蜘蛛素材制成的威严身体装备。\r\n毫无破绽，令敌人胆寒。", en = "ec2b26bd" }
"armorSeriesData.13147" = { text = "以骸蜘蛛素材制成的腕部装备。\r\n消除了一切妨碍行动的因素。", en = "88e28fbb" }
"armorSeriesData.13148" = { text = "以骸蜘蛛素材制成的腰部装备。\r\n旗帜般的珍珠光泽令人肃然起敬。", en = "0eeb6757" }
"armorSeriesData.13149" = { text = "以骸蜘蛛素材制成的脚部装备。\r\n逐片强化，将机动性发挥到极致。", en = "7632539f" }
"itemData.5982" = { text = "蛇王龙的钢鳞", en = "5ff0984f" }
"itemData.5983" = { text = "鳞中之王，连最锋利的刀刃也能挡下。\r\n能制作出惊人的装备。", en = "d58eec3b" }
"itemData.5984" = { text = "蛇王龙的尾鳞", en = "358dba42" }
"itemData.5985" = { text = "坚硬却柔韧的鳞片。\r\n可用来制作保护关节要害的柔软防具。", en = "2fcf6aa5" }
"itemData.5986" = { text = "蛇王龙的魔眼", en = "1eac23b4" }
"itemData.5987" = { text = "看透一切的眼睛。\r\n心志不坚的工匠将被它摧毁心神。", en = "e82ac5ef" }
"itemData.5988" = { text = "蛇王龙的胸壳", en = "d2f78c1f" }
"itemData.5989" = { text = "本就坚如金刚的身体中最坚硬的部位。\r\n坚不可摧。", en = "7972e789" }
"itemData.5990" = { text = "蛇王龙的刃鳞", en = "1d776ef7" }
"itemData.5991" = { text = "独特的鳞片，使其主人全身\r\n化为无数劈山裂石的利剑。", en = "871858f6" }
"itemData.5992" = { text = "蛇王龙的大刚爪", en = "fcb8d83d" }
"itemData.5993" = { text = "可怕的大爪。\r\n狠狠刨入大地，所过之处寸草不留。", en = "41ca8d8c" }
"itemData.5994" = { text = "蛇王龙的尾壳", en = "a8729408" }
"itemData.5995" = { text = "如鞭般的尾巴的甲壳。\r\n其挥动能撼动天界与人间。", en = "c0d28f69" }
"itemData.5996" = { text = "蛇王龙的扇刃", en = "b6320a5b" }
"itemData.5997" = { text = "蛇王龙背上最发达的刃鳞。\r\n能让大地为之哀号。", en = "b928192c" }
"itemData.5998" = { text = "螺旋骨", en = "db014017" }
"itemData.5999" = { text = "蛇王龙扭曲的螺旋状骨头。\r\n经过锤炼，强度难以估量。", en = "bbf1f554" }
"itemData.6000" = { text = "天刃玉", en = "dfcef62f" }
"itemData.6001" = { text = "末日之际，以巨蛇的生命力\r\n孕育出新星的宝玉。", en = "3d1be1e6" }
"itemData.6002" = { text = "碎裂的凶星", en = "58699407" }
"itemData.6003" = { text = "应蛇王龙之召而坠落的星星碎片。\r\n极难加工。", en = "88f9edcc" }
"itemData.6004" = { text = "蛇王龙票券", en = "38b0e9af" }
"itemData.6005" = { text = "印有蛇王龙的票券。\r\n可在加工店兑换，制作珍奇的装备。", en = "348f2e21" }
"itemData.6006" = { text = "蛇王龙的余料", en = "81d102a0" }
"itemData.6007" = { text = "小而残缺的素材。\r\n形状不规整，\r\n但收集起来可以制作随从用的武具。", en = "6898ea5e" }
"itemData.6008" = { text = "蛇王龙的上等钢鳞", en = "426f462b" }
"itemData.6009" = { text = "厚实而具王者风范的鳞片。\r\n强韧柔软，能轻易解决猎物。", en = "4b5a60e8" }
"itemData.6010" = { text = "蛇王龙的上等刃鳞", en = "158e2454" }
"itemData.6011" = { text = "无数带钩鳞片之一。\r\n蛇王龙爬行而过时能将山脉撕裂。", en = "686dd637" }
"itemData.6012" = { text = "蛇王龙的重胸壳", en = "84f470dd" }
"itemData.6013" = { text = "发出不祥轰鸣的鳞甲。\r\n随时准备将触及范围内的一切撕碎。", en = "28016c36" }
"itemData.6014" = { text = "蛇王龙的刚钩爪", en = "57d64d66" }
"itemData.6015" = { text = "掌握生死的钩爪。\r\n或许该说是“先生，后死”。", en = "27620cf0" }
"itemData.6016" = { text = "蛇王龙的上等扇刃", en = "8e728239" }
"itemData.6017" = { text = "特别巨大的一对扇刃。\r\n曾经斩断大地的龙脉。", en = "4cd18010" }
"itemData.6018" = { text = "蛇王龙的上等尾鳞", en = "8ba2f831" }
"itemData.6019" = { text = "紧密堆叠的厚鳞，能将空气撕裂。\r\n可大幅强化装备。", en = "640db672" }
"itemData.6020" = { text = "蛇王龙的重尾壳", en = "7bd287b8" }
"itemData.6021" = { text = "形似巨大剪刀的甲壳。\r\n在猎物面前举起时宛如死神的镰刀。", en = "61b35b02" }
"itemData.6022" = { text = "天刃的龙神玉", en = "26809181" }
"itemData.6023" = { text = "重塑世界的宝玉。\r\n血化为海，肉化为地，骨化为林。", en = "7f04e11d" }
"itemData.6024" = { text = "蛇帝龙的上等钢鳞", en = "8b30b98b" }
"itemData.6025" = { text = "蛇帝龙的外皮。\r\n坚硬柔韧的层层鳞片\r\n构成无懈可击的防御。", en = "b0cf9958" }
"itemData.6026" = { text = "蛇帝龙的上等刃鳞", en = "c23adcc9" }
"itemData.6027" = { text = "预示毁灭的绯红鳞片。\r\n能将伟大的命运无情斩断。", en = "512068ab" }
"itemData.6028" = { text = "蛇帝龙的魔眼", en = "db7862d8" }
"itemData.6029" = { text = "目光冰冷锐利的眼睛。\r\n大多数人连看一眼都承受不住。", en = "f1f5564b" }
"itemData.6030" = { text = "蛇帝龙的重胸壳", en = "78fb5117" }
"itemData.6031" = { text = "包覆心脏的厚甲。\r\n凡人打造的刀刃伤不了它分毫。", en = "a4babc2b" }
"itemData.6032" = { text = "蛇帝龙的刚钩爪", en = "1263b642" }
"itemData.6033" = { text = "巨大的钩爪。\r\n能将天地撕得粉碎。", en = "0e4d6747" }
"itemData.6034" = { text = "蛇帝龙的上等扇刃", en = "53f1b391" }
"itemData.6035" = { text = "特别巨大的一对扇刃。\r\n据说能划破天空，引来流星。", en = "f2d906d1" }
"itemData.6036" = { text = "蛇帝龙的上等尾鳞", en = "fbf7d116" }
"itemData.6037" = { text = "绯红扭曲的鳞片。\r\n紧密排列在势不可挡的尾巴上。", en = "8458b2c2" }
"itemData.6038" = { text = "蛇帝龙的重尾壳", en = "1ac6224c" }
"itemData.6039" = { text = "坚硬的甲壳。\r\n既是防御的铠甲，也是毁灭的武器。", en = "29163b7e" }
"itemData.6040" = { text = "蛇王龙的上等余料", en = "1fd348b7" }
"itemData.6041" = { text = "残缺的优质素材。\r\n形状不规整，\r\n但收集起来可以制作随从用的武具。", en = "81c36afe" }
"itemData.6042" = { text = "狱狼龙的坚壳", en = "0c8c4006" }
"itemData.6043" = { text = "狱狼龙的黑色甲壳。\r\n带着它就像背负着一片地狱。", en = "83e052ba" }
"itemData.6044" = { text = "狱狼龙的尖角", en = "200ced19" }
"itemData.6045" = { text = "令人恐惧的角。\r\n如今成了向所有龙宣战的象征。", en = "852346d5" }
"itemData.6046" = { text = "狱狼龙的尖爪", en = "b5901a54" }
"itemData.6047" = { text = "具毁灭性的爪。\r\n足以凭它开辟出绝对霸主的地位。", en = "d0313f4f" }
"itemData.6048" = { text = "狱狼龙的尾巴", en = "80cd5e53" }
"itemData.6049" = { text = "狱狼龙肌肉发达的尾巴。\r\n能轻易撕裂钢铁。", en = "beb1c22f" }
"itemData.6050" = { text = "狱狼龙的龙光壳", en = "d5652527" }
"itemData.6051" = { text = "蕴含强大龙属性能量的狱狼龙甲壳。\r\n应该非常适合加工。", en = "7043f8de" }
"itemData.6052" = { text = "蚀龙虫", en = "4c8c68ca" }
"itemData.6053" = { text = "喜爱屠龙果实、\r\n会积蓄龙属性能量的虫。\r\n是狱狼龙的力量来源。", en = "73916926" }
"itemData.6054" = { text = "狱狼龙的龙毛", en = "5f938558" }
"itemData.6055" = { text = "狱狼龙粗硬的龙毛。\r\n其中蕴含的灭龙之力令龙族畏惧。", en = "ecb2b25e" }
"itemData.6056" = { text = "狱狼龙的怨念石", en = "43aa7d4c" }
"itemData.6057" = { text = "偶尔才会在腹中形成的石头。\r\n死去的猎物是否仍活在其中？", en = "c0a6824e" }
"itemData.6058" = { text = "狱狼龙的龙鬃", en = "63aa4408" }
"itemData.6059" = { text = "寄宿着蚀龙虫的鬃毛。\r\n会迸发出红黑色的电光。", en = "b5a4d505" }
"itemData.6060" = { text = "狱狼龙的重壳", en = "b38abbc9" }
"itemData.6061" = { text = "狱狼龙的黑色重壳。\r\n这地狱般的甲壳中潜藏着邪恶的力量。", en = "fe275f2e" }
"itemData.6062" = { text = "狱狼龙的刚角", en = "5de47e67" }
"itemData.6063" = { text = "狱狼龙坚硬的角。\r\n其强大的力量是否代表着对龙的反抗？", en = "9f2320fe" }
"itemData.6064" = { text = "狱狼龙的刚爪", en = "0dd49402" }
"itemData.6065" = { text = "狱狼龙粗壮的爪。\r\n其力量足以开辟出绝对霸主的地位。", en = "c9a5b9bb" }
"itemData.6066" = { text = "狱狼龙的蓄龙壳", en = "6e8d1f24" }
"itemData.6067" = { text = "储存蚀龙虫之力的甲壳。\r\n蓄积的力量越多，\r\n就能做出越好的装备。", en = "9ced4913" }
"itemData.6068" = { text = "狱狼龙的韧尾", en = "0cee07d0" }
"itemData.6069" = { text = "狱狼龙强韧得可怕的尾巴。\r\n据说能将坚固的钢铁斩断。", en = "409a54f8" }
"itemData.6070" = { text = "狱狼龙的天玉", en = "de7a6c80" }
"itemData.6071" = { text = "只有极少数狱狼龙体内才有的\r\n稀有宝玉。\r\n是绝对征服者的证明。", en = "a189051f" }
"itemData.6072" = { text = "黑铠龙的坚壳", en = "bee4e06b" }
"itemData.6073" = { text = "黑铠龙的坚壳。\r\n呈焦黑色，很难加工。", en = "19dbfc14" }
"itemData.6074" = { text = "黑铠龙的头壳", en = "64678ef2" }
"itemData.6075" = { text = "从黑铠龙头部剥取的素材。\r\n看起来就像可怕的黑色面具。", en = "0a83631e" }
"itemData.6076" = { text = "黑铠龙的重壳", en = "4f3da829" }
"itemData.6077" = { text = "黑铠龙沉重的甲壳。\r\n就连灼热的熔岩\r\n也伤不了这坚固的甲壳。", en = "dbe8966b" }
"itemData.6078" = { text = "黑铠龙的重头壳", en = "ce1d9347" }
"itemData.6079" = { text = "能承受强力吐息的头部甲壳。\r\n值得研究。", en = "552bf156" }
"itemData.6080" = { text = "黑铠龙的天壳", en = "99039acf" }
"itemData.6081" = { text = "传说中的黑铠龙甲壳。\r\n将其加工者将统治大地、夺取天空。", en = "f89774b1" }
"itemData.6082" = { text = "一角龙的坚壳", en = "61f4127d" }
"itemData.6083" = { text = "比一角龙的甲壳更坚硬的部位。\r\n又名“重甲石”。", en = "261e6f2b" }
"itemData.6084" = { text = "一角龙的重壳", en = "43eea0b4" }
"itemData.6085" = { text = "比坚壳更强韧。\r\n当地的猎人称之为“纵隔壳”。", en = "12b55897" }
"itemData.6086" = { text = "一角龙的胸甲", en = "1375ce9a" }
"itemData.6087" = { text = "一角龙坚韧的甲壳。\r\n灼热的沙使它变得格外坚硬。", en = "0278ee85" }
"itemData.6088" = { text = "一角龙的重甲", en = "ae2f8ccb" }
"itemData.6089" = { text = "一角龙的背甲。\r\n只有最厚的部分才称得上“重甲”。", en = "fc359831" }
"itemData.6090" = { text = "绯红的美角", en = "1bad6df7" }
"itemData.6091" = { text = "一角龙最高级的红角。\r\n洋溢着力量与美感。", en = "3fa04fa0" }
"itemData.6092" = { text = "绯红的刚角", en = "c2a174f7" }
"itemData.6093" = { text = "有着凶猛螺纹的一角龙角。\r\n红得如同它夺走的无数生命。", en = "809b93ea" }
"itemData.6094" = { text = "一角龙的心脏", en = "b399a306" }
"itemData.6095" = { text = "一角龙的心脏。\r\n象征着纯粹的愤怒。", en = "58574810" }
"itemData.6096" = { text = "水蛇龙的厚皮", en = "9bb39989" }
"itemData.6097" = { text = "色彩鲜艳的厚皮。\r\n常用来制作高级皮革制品，颇受欢迎。", en = "10ed07c2" }
"itemData.6098" = { text = "水蛇龙的重壳", en = "6057921a" }
"itemData.6099" = { text = "坚固而鲜艳的甲壳。\r\n主人疲劳时警戒色就会褪去。", en = "ddc90191" }
"itemData.6100" = { text = "水蛇龙的水鸣甲", en = "feacf564" }
"itemData.6101" = { text = "亚种特有的特殊鸣甲。\r\n会改变形状以引导水流。", en = "636e5203" }
"itemData.6102" = { text = "骸蜘蛛的重壳", en = "c7e5dfad" }
"itemData.6103" = { text = "令人毛骨悚然的甲壳。\r\n品质虽好，\r\n但其剧毒般的外观令买家大吃一惊。", en = "e35e7974" }
"itemData.6104" = { text = "骸蜘蛛的重钳角", en = "76990479" }
"itemData.6105" = { text = "又长又锋利的剪刀状颚。\r\n足以将猎物一分为二。", en = "6f9838eb" }
"itemData.6106" = { text = "骸蜘蛛的刚爪", en = "354b4908" }
"itemData.6107" = { text = "骸蜘蛛用来剖开猎物的出色钩爪。\r\n令人不寒而栗。", en = "ab7be89a" }
"itemData.6108" = { text = "骸蜘蛛的秘棘", en = "409c7343" }
"itemData.6109" = { text = "毒素凝固而成的独特背棘。\r\n毒性与危险性都更强。", en = "1612b3f5" }
"skillData.656" = { text = "觉醒之刃", en = "a06174c2" }
"skillData.657" = { text = "解放武器潜藏的属性，\r\n并强化属性攻击及状态异常攻击。", en = "546db951" }
