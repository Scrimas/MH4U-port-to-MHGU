<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The installer's fontconfig when the system's has no font (gui/src/fonts.rs sets FONTCONFIG_FILE to this file;
     packaging/fonts.py puts it beside the AppImage's fonts): the fonts next to it, else the window would not open
     (fontique stops on a fontconfig without fonts). -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
