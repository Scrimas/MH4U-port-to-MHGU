[workspace]
members = ["core", "gui"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
# GPL v3 or later like the rest of the repo (LICENSE). Slint is used under its Royalty-free 2.0 licence, which
# requires the AboutSlint widget in the About dialog.
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
