[package]
name = "mh4uport-installer"
description = "MH4U Port installer: downloads the latest MH4U Port release into an MHGU emulator or Atmosphere mod folder"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
# the versions MHGU_Editor's app ships with (same toolchain and packaging, app/packaging/build.sh there)
slint = "=1.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "6"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
