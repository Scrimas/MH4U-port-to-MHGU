[package]
name = "mh4uport-installer"
description = "MH4U Port Installer: downloads and installs the MH4U Port mod for MHGU"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "mh4uport-installer"
path = "src/main.rs"

[dependencies]
mh4uport-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
# the same Slint as MHGU_Editor (its look, its pins); Slint's defaults without system-tray and accessibility
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"
