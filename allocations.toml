[[monster]]
name = "tigerstripe_zamtrios"           # folder monsters/tigerstripe_zamtrios (4U em092)
title = "Tigerstripe Zamtrios"
em_id = 0x143                           # Zamtrios (em 67) variant 1: GU's own class runs it (package.toml gu_class)
registry_index = 138
donor_index = 56                        # Zamtrios em067_00: its class, cro, flags, per-index records, map icon
file_ids = [0x10740, 0x1077f]
save_index = 106
name_entry = 106
notes_entry = 124
items = [2986, 2990]                    # 4U 1357..1361 (T.Zamtrios Shard, Piel, Grandfin, Sawtooth+, Tailbrand)
standin_id = 0x43                       # its quests name Zamtrios (loader-visible), swapped to 0x143 at spawn
