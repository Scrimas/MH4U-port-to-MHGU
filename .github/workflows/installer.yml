name: Installer

# MHGU Definitive Edition Installer (installer/): built from code only, no game data (the mod's releases are made by
# tools/release.py on the machine with the dumps).
#   tests        every push / PR touching installer/: cargo fmt, cargo test, the catalogs, the end-to-end CLI test
#                (installer/tests/cli_test.py, a fake release of dummy files) on Linux and Windows
#   build        v* tags (and by hand): installer/packaging/build.py in an Arch Linux container (the editor's
#                toolchain), every file cross built there: MHGU-Definitive-Edition-Installer-<v>-x86_64.exe
#                (mingw-w64), -arm64.exe (llvm-mingw), -x86_64.AppImage and -arm64.AppImage (zig, glibc 2.28, type 2
#                runtime) and SHA256SUMS-<v> of the four
#   windows      each shipped .exe started on Windows (x86_64, and Windows 11 on ARM): it opens its window and draws
#                it into a PNG, then quits
#   linux        each shipped AppImage started on Linux (x86_64, aarch64): --version, then its window drawn into PNGs
#                with the system's fonts, with a fontconfig without fonts, and without fontconfig (its own fonts)
#   release      a tag: a DRAFT release "MHGU Definitive Edition <v>" with the files, Latest once published
#                (GitHub's default: the newest version); its text comes from tools/release.py (NOTES-main.md).
#                This repository's releases are the installer's since 2.0.0; the mod's are on
#                MHGU-Definitive-Edition-Packages (tools/release.py). The installer tells its own releases by their
#                files (source.rs installer_releases)

on:
  push:
    branches: ["**"]
    tags: ["v*"]               # (GitHub does not evaluate path filters for tag pushes)
    paths: ["installer/**", ".github/workflows/installer.yml"]
  pull_request:
    paths: ["installer/**", ".github/workflows/installer.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q libxkbcommon-dev gettext
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path installer/Cargo.toml --all --check
      - name: Catalogs
        if: runner.os == 'Linux'
        run: python3 installer/tools/i18n.py --check
      - name: Unit tests
        run: cargo test --manifest-path installer/Cargo.toml --workspace --locked
      - name: End to end (command line, fake release)
        run: |
          cargo build --manifest-path installer/Cargo.toml -p mhgu-de-core --bin mhgu-de-cli --locked
          python installer/tests/cli_test.py

  build:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    env:
      # AppImage type 2 runtimes, pinned by release and checksum (as MHGU_Editor's release.yml)
      RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
      RUNTIME_ARM64_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-aarch64
      RUNTIME_ARM64_SHA256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
      # the arm64 .exe's toolchain (clang, lld, llvm-windres for aarch64-pc-windows-gnullvm), pinned the same way
      LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz
      LLVM_MINGW_SHA256: 55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335
    steps:
      - name: Toolchain
        run: |
          pacman -Syu --noconfirm --needed git github-cli rustup mingw-w64-gcc zig cargo-zigbuild squashfs-tools \
            python
          rustup default stable
          rustup target add x86_64-pc-windows-gnu aarch64-pc-windows-gnullvm aarch64-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
      - name: Version
        id: ver
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' installer/Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match installer/Cargo.toml version $ver"
            exit 1
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - name: AppImage runtimes, llvm-mingw
        run: |
          curl -fsSL -o "$RUNNER_TEMP/runtime-x86_64" "$RUNTIME_URL"
          echo "$RUNTIME_SHA256  $RUNNER_TEMP/runtime-x86_64" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/runtime-aarch64" "$RUNTIME_ARM64_URL"
          echo "$RUNTIME_ARM64_SHA256  $RUNNER_TEMP/runtime-aarch64" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
      - name: Build
        # llvm-mingw stays off PATH: build.py puts it there for the arm64 .exe only
        run: |
          APPIMAGE_RUNTIME="$RUNNER_TEMP/runtime-x86_64" APPIMAGE_RUNTIME_ARM64="$RUNNER_TEMP/runtime-aarch64" \
            LLVM_MINGW="$RUNNER_TEMP/llvm-mingw" python installer/packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: MHGU-Definitive-Edition-Installer-${{ steps.ver.outputs.ver }}
          path: installer/dist/*${{ steps.ver.outputs.ver }}*
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: windows-latest }
          - { arch: arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    env:
      VER: ${{ needs.build.outputs.ver }}
      EXE: dist/MHGU-Definitive-Edition-Installer-${{ needs.build.outputs.ver }}-${{ matrix.arch }}.exe
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MHGU-Definitive-Edition-Installer-${{ needs.build.outputs.ver }}
          path: dist
      - name: Start the .exe
        run: |
          test "$("$EXE" --version | tr -d '\r')" = "$VER"
          MHGU_DE_SNAPSHOT=window.png timeout 180 "$EXE"
          test -s window.png
          # the Start Menu shortcut it wrote at start (gui/src/desktop.rs)
          test -s "$(cygpath "$APPDATA")/Microsoft/Windows/Start Menu/Programs/MHGU Definitive Edition Installer.lnk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.arch }}-window-${{ needs.build.outputs.ver }}
          path: window.png
          if-no-files-found: ignore
          retention-days: 3

  linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    env:
      VER: ${{ needs.build.outputs.ver }}
      APP: dist/MHGU-Definitive-Edition-Installer-${{ needs.build.outputs.ver }}-${{ matrix.arch }}.AppImage
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MHGU-Definitive-Edition-Installer-${{ needs.build.outputs.ver }}
          path: dist
      - name: Start the AppImage
        # the runner has no FUSE: the runtime unpacks it instead of mounting it
        run: |
          chmod +x "$APP"
          test "$(APPIMAGE_EXTRACT_AND_RUN=1 "$APP" --version)" = "$VER"
      - name: Open the window (system fonts, a fontconfig without fonts, no fontconfig)
        # under Xvfb, each start draws its window into a PNG, then quits. Without system fonts the window takes the
        # AppImage's own (installer/gui/src/fonts.rs): an empty fontconfig (in Chinese, the CJK fonts), then
        # libfontconfig itself hidden behind /dev/null
        run: |
          set -o pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libfontconfig1 fonts-dejavu-core libegl1 libegl-mesa0 libgl1 libglx-mesa0 \
            libgl1-mesa-dri libxkbcommon-x11-0 libxcursor1 libxi6
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99
          sleep 3
          shot() {  # <name> [VAR=value ...]: the window drawn into <name>.png, its output in <name>.log
            n=$1
            shift
            env "$@" APPIMAGE_EXTRACT_AND_RUN=1 MHGU_DE_SNAPSHOT="$PWD/$n.png" timeout 180 "$APP" 2>&1 | tee "$n.log"
            test -s "$n.png"
          }
          shot system-fonts
          if grep -q 'the bundled fonts' system-fonts.log; then
            echo "::error::the bundled fonts with the system's"
            exit 1
          fi
          printf '<fontconfig></fontconfig>\n' > "$RUNNER_TEMP/empty.conf"
          shot fontconfig-without-fonts FONTCONFIG_FILE="$RUNNER_TEMP/empty.conf" LANGUAGE=zh_TW
          grep -q 'fontconfig has no font, the bundled fonts' fontconfig-without-fonts.log
          lib=$(ldconfig -p | awk '/libfontconfig\.so\.1 /{print $NF; exit}')
          sudo mount --bind /dev/null "$lib"
          shot no-fontconfig
          grep -q 'no fontconfig, the bundled fonts' no-fontconfig.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.arch }}-window-${{ needs.build.outputs.ver }}
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 3

  release:
    needs: [build, windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.build.outputs.ver }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MHGU-Definitive-Edition-Installer-${{ needs.build.outputs.ver }}
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "MHGU Definitive Edition $VER" --notes "Release text: tools/release.py publish / main-notes" \
            dist/*"$VER"*
