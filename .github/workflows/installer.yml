name: Installer

# MHGU Definitive Edition Installer (installer/): built from code only, no game data (the mod's releases are made by
# tools/release.py on the machine with the dumps).
#   tests        every push / PR touching installer/: cargo fmt, cargo test, the catalogs, the end-to-end CLI test
#                (installer/tests/cli_test.py, a fake release of dummy files) on Linux and Windows
#   build        v* tags (and by hand): installer/packaging/build.py in an Arch Linux container (the editor's
#                toolchain): MHGU-Definitive-Edition-Installer-<v>-x86_64.exe (mingw-w64), .AppImage (zig, glibc
#                2.28, type 2 runtime) and SHA256SUMS-<v>
#   windows      the shipped .exe started on Windows: it opens its window and draws it into a PNG, then quits
#   release      a tag: a DRAFT release "MHGU Definitive Edition <v>" with the files, Latest once published
#                (GitHub's default: the newest version); its text comes from tools/release.py (NOTES-main.md).
#                This repository's releases are the installer's since 2.0.0; the mod's are on
#                MHGU-Definitive-Edition-Packages (tools/release.py). The installer tells its own releases by their
#                files (source.rs installer_releases)

on:
  push:
    branches: ["**"]
    tags: ["v*"]               # (GitHub does not evaluate path filters for tag pushes)
    paths: ["installer/**", ".github/workflows/installer.yml"]
  pull_request:
    paths: ["installer/**", ".github/workflows/installer.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q libfontconfig1-dev libxkbcommon-dev gettext
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path installer/Cargo.toml --all --check
      - name: Catalogs
        if: runner.os == 'Linux'
        run: python3 installer/tools/i18n.py --check
      - name: Unit tests
        run: cargo test --manifest-path installer/Cargo.toml --workspace --locked
      - name: End to end (command line, fake release)
        run: |
          cargo build --manifest-path installer/Cargo.toml -p mhgu-de-core --bin mhgu-de-cli --locked
          python installer/tests/cli_test.py

  build:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    env:
      # AppImage type 2 runtime, pinned by release and checksum (as MHGU_Editor's release.yml)
      RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
    steps:
      - name: Toolchain
        run: |
          pacman -Syu --noconfirm --needed git github-cli rustup mingw-w64-gcc zig cargo-zigbuild squashfs-tools \
            fontconfig python
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
      - name: Version
        id: ver
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' installer/Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match installer/Cargo.toml version $ver"
            exit 1
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - name: AppImage runtime
        run: |
          curl -fsSL -o "$RUNNER_TEMP/runtime-x86_64" "$RUNTIME_URL"
          echo "$RUNTIME_SHA256  $RUNNER_TEMP/runtime-x86_64" | sha256sum -c -
      - name: Build
        run: APPIMAGE_RUNTIME="$RUNNER_TEMP/runtime-x86_64" python installer/packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: MHGU-Definitive-Edition-Installer-${{ steps.ver.outputs.ver }}
          path: installer/dist/*${{ steps.ver.outputs.ver }}*
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: build
    runs-on: windows-latest
    env:
      VER: ${{ needs.build.outputs.ver }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MHGU-Definitive-Edition-Installer-${{ needs.build.outputs.ver }}
          path: dist
      - name: Start the .exe
        run: |
          test "$("dist/MHGU-Definitive-Edition-Installer-$VER-x86_64.exe" --version | tr -d '\r')" = "$VER"
          MHGU_DE_SNAPSHOT=window.png timeout 180 "dist/MHGU-Definitive-Edition-Installer-$VER-x86_64.exe"
          test -s window.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-window-${{ needs.build.outputs.ver }}
          path: window.png
          if-no-files-found: ignore
          retention-days: 3

  release:
    needs: [build, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.build.outputs.ver }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MHGU-Definitive-Edition-Installer-${{ needs.build.outputs.ver }}
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "MHGU Definitive Edition $VER" --notes "Release text: tools/release.py publish / main-notes" \
            dist/*"$VER"*
