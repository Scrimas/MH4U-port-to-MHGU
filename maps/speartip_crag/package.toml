# Speartip Crag map package: 4U m08 as an alias of GU stage 18 (the Sanctuary), loaded from folder m29 while the
# quests of a monster requiring it run (module/stage_alias.c): stage arcs, area maps, map_com, area streams. Notes:
# monsters/dalamadur/notes/speartip-crag.md (maps/speartip_crag/notes/README.md).
name = "speartip_crag"
kind = "map"
title = "Speartip Crag"
version = "1.0.0"          # bump on every published change of this map's files
requires_core = "2.0.0"    # oldest core that knows map packages (module/port.c port_installed: a monster whose
                           # map is missing counts as not installed)
folder = 29                # its RomFS stage folder m29 = allocations.toml stage_alias[1] of every monster
                           # requiring it (tools/alloc.py checks it)
stage_4u = 8               # 4U stage m08: its quest-board name per language is 4U's mapName[8] (the installer's title)

[stage]                    # Speartip Crag as an alias of the Sanctuary (allocations.toml stage_alias,
                           # module/stage_alias.c)
kinds = [49, 54, 55, 56, 58]   # arc paths -> m29: mapUI, map_com, language map_com, stage, area
hold_kobj_areas = [1]      # arena: the three breakables (spire k02 = mId 3) stand until Dalamadur breaks them
maprec = [[5.0, 24, -12], [1.5, 4, -20]]   # area maps: 4U m08 a00 / a01 records {k, x, y}
                           # (4U table 0xeebe0c + 0x18 * 8, checked by tools/build_speartip_ui.py)
wholemap_k = 1.3333333     # whole map: GU dims[18] / 4U m08 W = 40000 / 30000 (build_speartip_ui.py)
